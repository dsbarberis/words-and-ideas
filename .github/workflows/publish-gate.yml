# Publish gate: a pull request to main that touches deck or guarded files may merge only
# after the gate has passed for its newest commit. The thread that runs the gate adds the
# label "gate passed <first 7 characters of that commit>" as its last step; a new push
# makes a new commit, so an older label no longer counts.
#
# Why a GitHub check: hooks in .claude/settings.json never run in claude.ai Project threads
# (found Nov 9, 2026), so the merge hook never held. The Architect chose this replacement
# ("Build the plan", Nov 9, 2026). When "Publish gate" is a required check on main with no
# bypass, GitHub itself refuses a merge without the label.
#
# Safety: pull_request_target runs main's own copy of this file, so a pull request can't
# change the check that judges it. The job never checks out or runs the pull request's
# files; it reads only the list of changed file names and the labels. It needs no secret.
#
# Waiting, not failed (the Architect's card "Stop the Publish gate's false failure emails how?",
# Nov 16, 2026: "Gate shows waiting, not failed"). A new commit can't carry its label yet, so a
# failing check sent a "Run failed" email for every deck commit. Now the job itself always ends
# well, and the required "Publish gate" result is a commit status this job sets on the newest
# commit: "pending" (waiting for its label), "success", or "failure" only for a real fault (a
# pull request too big to check). A pending status blocks a merge just as a failure does, and
# GitHub sends no email for it. Each run first sets "pending", so an earlier "success" never
# stands while the commit is checked again; if the run then breaks, its last step sets "failure"
# (and if even that fails, the status stays pending). Either way the merge stays blocked.
#
# The path list below copies the gate's gated, guarded and named-reviewer paths from the
# gate's settings (kept in the project's files, not here). Change both together.
name: Publish gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  pull-requests: read
  statuses: write

concurrency:
  group: publish-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-gate:
    # Not "Publish gate": that name is the commit status below, which main requires.
    name: Publish gate runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set the Publish gate status on the newest commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import fnmatch, json, os, subprocess, sys

          def post(state, text):
              # The required check: a commit status named "Publish gate" on the newest commit.
              print(f"Publish gate: {state}: {text}")
              r = subprocess.run(["gh", "api", "-X", "POST", f"repos/{os.environ['REPO']}/statuses/{os.environ['HEAD_SHA']}",
                                  "-f", f"state={state}", "-f", "context=Publish gate", "-f", f"description={text[:140]}",
                                  "-f", f"target_url={os.environ['RUN_URL']}"], capture_output=True, text=True)
              if r.returncode:
                  print(r.stderr, file=sys.stderr); sys.exit(1)

          def status(state, text):
              post(state, text); sys.exit(0)

          # Pending first, so an earlier "success" on this commit never stands while it is checked again
          # (for example after its label is removed); if this run then breaks, the last step sets failure.
          post("pending", "Checking the gate label against this commit.")
          GLOBS = ["*.html", ".claude/**", ".github/**", "parts/check/**",
                   "standard-deck/build.js", "standard-deck/course.json", "standard-deck/decks/**",
                   "standard-deck/glossary.js", "standard-deck/template.html",
                   "standard-deck/tests/**", "standard-deck/vocabulary.js"]

          def match(path, glob):
              # As the gate does: a pattern with no "/" matches files at the top only; case is ignored.
              path, glob = path.lower(), glob.lower()
              return fnmatch.fnmatchcase(path, glob) and ("/" in glob or "/" not in path)

          if int(os.environ.get("CHANGED") or 0) > 3000:
              status("failure", "Refused: more than 3000 changed files, so the check can't see them all. Split the pull request.")
          # One JSON string per line, so a file name with a space or a line break stays whole.
          raw = subprocess.run(["gh", "api", "--paginate", f"repos/{os.environ['REPO']}/pulls/{os.environ['PR']}/files",
                                "--jq", ".[] | (.filename, (.previous_filename // empty)) | tojson"],
                               capture_output=True, text=True, check=True).stdout
          out = [json.loads(l) for l in raw.splitlines() if l.strip()]
          touched = sorted({p for p in out if not p.startswith("backups/") and any(match(p, g) for g in GLOBS)})
          if not touched:
              status("success", "Touches no deck or guarded files, so the publish gate does not apply.")
          want = "gate passed " + os.environ["HEAD_SHA"][:7]
          labels = json.loads(os.environ["LABELS"] or "[]")
          print("Gated or guarded files:", ", ".join(touched[:20]) + (" …" if len(touched) > 20 else ""))
          if want in labels:
              status("success", f'The gate passed for the newest commit ("{want}").')
          old = [l for l in labels if l.startswith("gate passed")]
          status("pending", f'Waiting for the label "{want}": run the gate for this commit, then add it.'
                 + (" Older gate labels are for earlier commits." if old else ""))
          PY
      - name: Set the Publish gate status to failure if the check itself broke
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state=failure -f "context=Publish gate" \
            -f "description=The check itself broke; see the run. A merge stays blocked." -f "target_url=$RUN_URL"
