<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Latin Roots Flashcards</title>
<style>
  :root {
    --paper: #efe7d8;
    --card: #fbf7ec;
    --card-back: #263248;
    --ink: #2a2f26;
    --ink-soft: #5a5648;
    --navy: #263248;
    --burgundy: #7a2e2e;
    --burgundy-dark: #5f2222;
    --sage: #5c6e4f;
    --sage-dark: #445238;
    --gold: #b08d57;
    --rule: #d8cbae;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 60px;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-weight: 700;
    font-size: clamp(26px, 5vw, 34px);
    color: var(--navy);
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .rule {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 18px 0 20px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .tab {
    font-family: Georgia, serif;
    font-size: 14px;
    padding: 7px 16px;
    border: 1px solid var(--rule);
    background: var(--card);
    color: var(--ink-soft);
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .tab.active {
    background: var(--navy);
    color: var(--paper);
    border-color: var(--navy);
  }

  .tab:focus-visible, button:focus-visible {
    outline: 2px solid var(--burgundy);
    outline-offset: 2px;
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--ink-soft);
    flex-wrap: wrap;
    gap: 8px;
  }

  .toolbar-right {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .icon-btn {
    background: none;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }

  .icon-btn:hover { background: rgba(0,0,0,0.04); }

  /* Progress bar */
  .progress-track {
    width: 100%;
    height: 5px;
    background: var(--rule);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 22px;
  }

  .progress-fill {
    height: 100%;
    background: var(--sage);
    width: 0%;
    transition: width 0.25s ease;
  }

  /* Card stage */
  .stage {
    margin-bottom: 22px;
  }

  .card {
    position: relative;
    width: 100%;
    height: 300px;
    cursor: pointer;
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
    text-align: center;
    box-shadow: 0 8px 22px rgba(38, 50, 72, 0.18), 0 1px 0 rgba(0,0,0,0.04);
    transition: opacity 0.28s ease, transform 0.28s ease;
  }

  .face-front {
    background: var(--card);
    border: 1px solid var(--rule);
    opacity: 1;
    transform: scale(1);
    z-index: 2;
  }

  .face-back {
    background: var(--card-back);
    color: var(--paper);
    opacity: 0;
    transform: scale(0.97);
    z-index: 1;
    pointer-events: none;
  }

  .card.flipped .face-front {
    opacity: 0;
    transform: scale(0.97);
    z-index: 1;
    pointer-events: none;
  }

  .card.flipped .face-back {
    opacity: 1;
    transform: scale(1);
    z-index: 2;
    pointer-events: auto;
  }

  .category-tag {
    position: absolute;
    top: 14px;
    left: 16px;
    font-size: 11px;
    text-transform: none;
    letter-spacing: 0.3px;
    color: var(--gold);
    font-family: Georgia, serif;
    font-style: italic;
  }

  .term {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 700;
    color: var(--navy);
    line-height: 1.25;
  }

  .hint {
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .meaning {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: clamp(20px, 4.5vw, 26px);
    font-style: italic;
    margin-bottom: 14px;
  }

  .examples {
    font-size: 14px;
    color: #d9dee8;
    max-width: 90%;
    line-height: 1.5;
  }

  .examples .examples-label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gold);
    margin-bottom: 6px;
  }

  /* Mastery buttons */
  .mastery-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .mastery-btn {
    flex: 1;
    max-width: 220px;
    padding: 11px 10px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.1s ease, filter 0.15s ease;
  }

  .mastery-btn:active { transform: scale(0.97); }

  .btn-learning {
    background: #f1e4d0;
    color: var(--burgundy-dark);
    border: 1px solid var(--burgundy);
  }
  .btn-learning:hover { filter: brightness(0.96); }

  .btn-known {
    background: var(--sage);
    color: var(--paper);
  }
  .btn-known:hover { background: var(--sage-dark); }

  .btn-known.active {
    box-shadow: inset 0 0 0 2px var(--sage-dark);
  }
  .btn-learning.active {
    box-shadow: inset 0 0 0 2px var(--burgundy-dark);
  }

  /* Nav row */
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-btn {
    background: var(--navy);
    color: var(--paper);
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }

  .nav-btn:hover { background: #1c2536; }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }

  .counter {
    font-size: 14px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  footer {
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
  }

  footer button {
    background: none;
    border: none;
    color: var(--burgundy);
    text-decoration: underline;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    padding: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .face { transition: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Latin Roots Flashcards</h1>
    <div class="subtitle">Bases and prefixes for building English vocabulary</div>
  </header>

  <hr class="rule" />

  <div class="tabs" role="tablist" aria-label="Card set">
    <button class="tab active" data-filter="all" role="tab" aria-selected="true">All (79)</button>
    <button class="tab" data-filter="base" role="tab" aria-selected="false">Bases (50)</button>
    <button class="tab" data-filter="prefix" role="tab" aria-selected="false">Prefixes (29)</button>
  </div>

  <div class="toolbar">
    <span id="knownCount">0 marked known</span>
    <div class="toolbar-right">
      <button class="icon-btn" id="shuffleBtn">Shuffle</button>
      <button class="icon-btn" id="resetBtn">Reset progress</button>
    </div>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard, tap or press Enter to flip">
      <div class="face face-front">
        <div class="category-tag" id="tagFront">base</div>
        <div class="term" id="termFront">ALIEN-</div>
        <div class="hint">Tap card to reveal meaning</div>
      </div>
      <div class="face face-back">
        <div class="category-tag" id="tagBack" style="color:#c9b98a;">base</div>
        <div class="meaning" id="meaningBack">belonging to another, foreign</div>
        <div class="examples"><span class="examples-label">Examples</span><span id="examplesBack">alienate, alien, inalienable</span></div>
      </div>
    </div>
  </div>

  <div class="mastery-row">
    <button class="mastery-btn btn-learning" id="learningBtn">Still learning</button>
    <button class="mastery-btn btn-known" id="knownBtn">Know it</button>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn">&larr; Prev</button>
    <span class="counter" id="counter">1 / 79</span>
    <button class="nav-btn" id="nextBtn">Next &rarr;</button>
  </div>

  <footer>
    Click the card (or press Space) to flip &middot; Arrow keys to move &middot;
    <button id="clearFilterHint" style="display:none;"></button>
  </footer>
</div>

<script>
  const DATA = [
    ["ALIEN-", "belonging to another, foreign", "alienate, alien, inalienable", "base"],
    ["ART-", "skill, craft", "artisan, artificial, artifact", "base"],
    ["CED-, CESS-", "to go, yield, withdraw", "proceed, recede, concession, access", "base"],
    ["CLUD-, CLUS-, [CLOS-]", "to close, shut", "include, exclude, conclusion, closure", "base"],
    ["CRUC-", "cross", "crucial, crucifix, excruciating", "base"],
    ["CUR(R)-, CURS- [COURS-], [COR(S)-]", "to run", "current, cursive, excursion, course", "base"],
    ["DUC, DUCT-", "to lead", "conduct, induce, deduction", "base"],
    ["FAC- [FIC-]", "to make, do", "factory, manufacture, fiction, deficient", "base"],
    ["FIN-", "end, boundary", "finish, final, infinite", "base"],
    ["FIRM-", "strong, firm", "confirm, affirm, infirmary", "base"],
    ["FORT-", "strong, brave", "fortify, fortress, effort", "base"],
    ["GRAD-, GRESS-", "to step, go, walk", "graduate, progress, regression", "base"],
    ["GRAND-", "great, large", "grandeur, aggrandize, grandiose", "base"],
    ["GRAV- [GRIEV-]", "heavy", "gravity, aggravate, grieve", "base"],
    ["GREG-", "flock, group", "gregarious, segregate, congregate", "base"],
    ["HAB-, AB- [HIB-]", "to have, hold", "habit, exhibit, inhibit, prohibit", "base"],
    ["JUDIC-", "to judge", "judicial, prejudice, adjudicate", "base"],
    ["JUR-, JUST-", "law, right, to swear", "jury, justice, jurisdiction, perjury", "base"],
    ["LEV-", "light (weight), to lift", "elevate, levity, alleviate", "base"],
    ["LINE- [LIGN-]", "line, thread", "linear, delineate, align", "base"],
    ["LIMIN-", "threshold", "preliminary, subliminal, eliminate", "base"],
    ["LOC-", "place", "locate, dislocate, allocate", "base"],
    ["LOQU-, LOCUT-", "to speak, talk", "eloquent, loquacious, elocution", "base"],
    ["LUD-, LUS-", "to play", "illusion, allude, ludicrous", "base"],
    ["NIHIL-", "nothing", "nihilism, annihilate", "base"],
    ["NOMIN-", "name", "nominate, denomination, nominal", "base"],
    ["NUL(L)-", "none, not any", "null, nullify, annul", "base"],
    ["PART-", "part, share", "partial, participate, partition", "base"],
    ["PED-", "foot", "pedal, pedestrian, expedition", "base"],
    ["PEND-, PENS-", "to hang, weigh, pay", "suspend, pension, compensate", "base"],
    ["PLE-, PLET-, PLEN-", "to fill, full", "complete, deplete, plenty", "base"],
    ["PREC-", "to pray, ask, beg", "deprecate, imprecation, precarious", "base"],
    ["PULS-", "to drive, push, beat", "pulse, repulsive, compulsion", "base"],
    ["PUNG-, PUNCT-", "to prick, pierce, point", "pungent, punctual, puncture", "base"],
    ["SACR- [SECR-]", "sacred, holy", "sacred, sacrifice, consecrate, sacrilege", "base"],
    ["SANCT-", "holy, inviolable", "sanctuary, sanction, sanctify", "base"],
    ["SED-", "to sit, settle", "sedentary, sediment, reside", "base"],
    ["SENT-, SENS-", "to feel, perceive", "sentiment, sensation, consent", "base"],
    ["SPEC-, (SPIC-), SPECT-", "to look, see", "spectacle, inspect, conspicuous", "base"],
    ["SPIR-", "to breathe", "inspire, respire, conspire", "base"],
    ["TRUD, TRUS-", "to push, thrust", "intrude, protrude, obtrusive", "base"],
    ["TURB-", "to disturb, confuse, crowd", "turbulent, disturb, perturb", "base"],
    ["UND- [OUND-]", "wave", "undulate, abound, redundant", "base"],
    ["VEN-, VENT, [VENU-]", "to come", "convene, prevent, venue", "base"],
    ["VERB-", "word", "verbal, verbose, proverb", "base"],
    ["VERT-, VERS-", "to turn", "convert, reverse, invert", "base"],
    ["VEST-", "clothing", "invest, divest, vestment", "base"],
    ["VI(A)-", "way, road", "via, deviate, viaduct", "base"],
    ["VID-, VIS- [VIEW-]", "to see", "video, visible, review", "base"],
    ["VOC-, VOK-", "to call, voice", "vocal, vocation, invoke", "base"],

    ["AB-, A-, ABS-", "away from, from", "absent, avert, abstain", "prefix"],
    ["AD-, AC-", "to, toward", "adhere, accept, advance", "prefix"],
    ["AMBI-", "both, around", "ambidextrous, ambiguous", "prefix"],
    ["ANTE-", "before", "antebellum, anteroom, antecedent", "prefix"],
    ["CIRCUM-", "around", "circumference, circumvent", "prefix"],
    ["CON-, COM-, CO-", "with, together", "connect, combine, cooperate", "prefix"],
    ["CONTRA-, CONTRO-, COUNTER-", "against", "contradict, controversy, counteract", "prefix"],
    ["DE-", "down, away, reversal", "descend, depart, devalue", "prefix"],
    ["DIS-, DI-, DIF-", "apart, not, away", "disagree, divert, differ", "prefix"],
    ["EX-, E-, EF-", "out, out of", "exit, emit, efface", "prefix"],
    ["EXTRA-, EXTRO-", "outside, beyond", "extraordinary, extrovert, extraterrestrial", "prefix"],
    ["IN-, IM- [IG- before n] (negative)", "not, without", "inactive, impossible, ignoble", "prefix"],
    ["IN-, IM-, [EN-], [EM-] (directional)", "into, in, on", "inject, immerse, enclose, empower", "prefix"],
    ["INFRA-", "below, beneath", "infrastructure, infrared", "prefix"],
    ["INTER-", "between, among", "interact, international, intersect", "prefix"],
    ["INTRA-, INTRO-", "within, inside", "intramural, introvert, introspect", "prefix"],
    ["NON-", "not", "nonsense, nonexistent, nonfiction", "prefix"],
    ["OB-", "against, toward, in the way", "object, obstruct, obstacle", "prefix"],
    ["PER-", "through, thoroughly", "permeate, perceive, persist", "prefix"],
    ["POST-", "after", "postpone, posterity, postwar", "prefix"],
    ["PRE-", "before", "predict, prevent, precede", "prefix"],
    ["PRO-", "forward, for, in favor of", "proceed, promote, propose", "prefix"],
    ["RE-, RED- (before vowels)", "back, again", "return, redeem, react", "prefix"],
    ["RETRO-", "backward", "retrospect, retroactive, retrograde", "prefix"],
    ["SE-, SED- (before vowels)", "apart, aside, without", "separate, secede, sedition", "prefix"],
    ["SUB-, SUS-, SUC-", "under, below", "submarine, suspend, succeed", "prefix"],
    ["SUPER- [SUR-]", "above, over", "superior, surpass, superimpose", "prefix"],
    ["TRANS-, TRAN-, TRA-", "across, through, beyond", "transmit, transcend, traverse", "prefix"],
    ["ULTRA-", "beyond, excessively", "ultraviolet, ultrasound, ultramodern", "prefix"],
  ].map(([term, meaning, examples, cat]) => ({ term, meaning, examples, cat }));

  const STORAGE_KEY = "latinFlashcards_known_v1";

  let known = new Set();
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) known = new Set(JSON.parse(raw));
  } catch (e) { /* storage unavailable, proceed without persistence */ }

  function saveKnown() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...known])); }
    catch (e) { /* ignore */ }
  }

  let order = DATA.map((_, i) => i);
  let filter = "all";
  let pos = 0;
  let flipped = false;

  const cardEl = document.getElementById("card");
  const termFront = document.getElementById("termFront");
  const tagFront = document.getElementById("tagFront");
  const tagBack = document.getElementById("tagBack");
  const meaningBack = document.getElementById("meaningBack");
  const examplesBack = document.getElementById("examplesBack");
  const counterEl = document.getElementById("counter");
  const knownCountEl = document.getElementById("knownCount");
  const progressFill = document.getElementById("progressFill");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const knownBtn = document.getElementById("knownBtn");
  const learningBtn = document.getElementById("learningBtn");
  const shuffleBtn = document.getElementById("shuffleBtn");
  const resetBtn = document.getElementById("resetBtn");
  const tabs = document.querySelectorAll(".tab");

  function currentList() {
    return order.filter(i => filter === "all" || DATA[i].cat === filter);
  }

  function labelFor(cat) { return cat === "base" ? "base" : "prefix"; }

  function render() {
    const list = currentList();
    if (list.length === 0) { list.push(0); }
    if (pos >= list.length) pos = 0;
    if (pos < 0) pos = list.length - 1;
    const idx = list[pos];
    const item = DATA[idx];

    termFront.textContent = item.term;
    tagFront.textContent = labelFor(item.cat);
    tagBack.textContent = labelFor(item.cat);
    meaningBack.textContent = item.meaning;
    examplesBack.textContent = item.examples;

    cardEl.classList.toggle("flipped", flipped);
    counterEl.textContent = `${pos + 1} / ${list.length}`;

    const isKnown = known.has(idx);
    knownBtn.classList.toggle("active", isKnown);
    learningBtn.classList.toggle("active", !isKnown && learningMarked.has(idx));

    knownCountEl.textContent = `${known.size} of ${DATA.length} marked known`;
    progressFill.style.width = `${(known.size / DATA.length) * 100}%`;

    prevBtn.disabled = list.length <= 1;
    nextBtn.disabled = list.length <= 1;
  }

  let learningMarked = new Set();

  function flip() {
    flipped = !flipped;
    cardEl.classList.toggle("flipped", flipped);
  }

  function goNext() {
    const list = currentList();
    pos = (pos + 1) % list.length;
    flipped = false;
    render();
  }

  function goPrev() {
    const list = currentList();
    pos = (pos - 1 + list.length) % list.length;
    flipped = false;
    render();
  }

  function markKnown() {
    const idx = currentList()[pos];
    known.add(idx);
    learningMarked.delete(idx);
    saveKnown();
    render();
    setTimeout(goNext, 220);
  }

  function markLearning() {
    const idx = currentList()[pos];
    known.delete(idx);
    learningMarked.add(idx);
    saveKnown();
    render();
    setTimeout(goNext, 120);
  }

  function shuffle() {
    const list = currentList();
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    // write back shuffled positions into `order` for this filter, preserving others
    if (filter === "all") {
      order = list;
    } else {
      let cursor = 0;
      order = order.map(i => {
        if (DATA[i].cat === filter) { return list[cursor++]; }
        return i;
      });
    }
    pos = 0;
    flipped = false;
    render();
  }

  cardEl.addEventListener("click", flip);
  cardEl.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); flip(); }
  });

  document.addEventListener("keydown", (e) => {
    if (e.target === cardEl) return;
    if (e.code === "ArrowRight") goNext();
    if (e.code === "ArrowLeft") goPrev();
    if (e.code === "Space") { e.preventDefault(); flip(); }
  });

  prevBtn.addEventListener("click", goPrev);
  nextBtn.addEventListener("click", goNext);
  knownBtn.addEventListener("click", (e) => { e.stopPropagation(); markKnown(); });
  learningBtn.addEventListener("click", (e) => { e.stopPropagation(); markLearning(); });
  shuffleBtn.addEventListener("click", shuffle);

  resetBtn.addEventListener("click", () => {
    known = new Set();
    learningMarked = new Set();
    saveKnown();
    render();
  });

  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => { t.classList.remove("active"); t.setAttribute("aria-selected", "false"); });
      tab.classList.add("active");
      tab.setAttribute("aria-selected", "true");
      filter = tab.dataset.filter;
      pos = 0;
      flipped = false;
      render();
    });
  });

  render();
</script>

</body>
</html>
