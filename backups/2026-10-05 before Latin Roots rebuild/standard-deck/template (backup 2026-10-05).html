    const dx = x - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    touchStart.track.push([e.timeStamp, x]);
    if (touchStart.track.length > 8) touchStart.track.shift();
    if (!touchStart.dragging && Math.abs(dx) > 10 && Math.abs(dx) > 1.5 * Math.abs(dy)) {
      touchStart.dragging = true;
      if (touchStart.follow) cardEl.classList.add("dragging");
    }
    // The card follows the finger exactly, with the next card beside it.
    if (touchStart.dragging && touchStart.follow && !sliding) dragTo(dx);
  }, { passive: true });
  function endTouch(e) {
    if (!touchStart) return;
    const t = e.changedTouches && e.changedTouches[0];
    const x = t ? t.clientX : touchStart.x;
    const dx = x - touchStart.x;
    const dy = t ? t.clientY - touchStart.y : 0;
    // Finger speed over the last ~100ms, in px per ms (negative = leftwards).
    const tr = touchStart.track;
    const now = e.timeStamp;
    let k = 0;
    while (k < tr.length - 1 && now - tr[k][0] > 100) k++;
    const v = now > tr[k][0] ? (x - tr[k][1]) / (now - tr[k][0]) : 0;
    const st = touchStart;
    touchStart = null;
    if (st.dragging) swipeHandledAt = Date.now();
    const horizontal = Math.abs(dx) > 1.5 * Math.abs(dy);
    // A long drag, or a short fast flick, in a consistent direction.
    const enough = Math.abs(dx) >= 50 || (Math.abs(dx) >= 15 && Math.abs(v) >= 0.35);
    const sameWay = Math.abs(v) < 0.1 || (v < 0) === (dx < 0);
    // Swipe left (finger moves left) = next card.
    const moved = horizontal && enough && sameWay && swipe(dx < 0 ? 1 : -1, Math.abs(v));
    if (!moved && st.follow && !sliding) {
      cardEl.classList.remove("dragging");
      snapBack();
    } else if (!moved) dropPeek();
  }
  stage.addEventListener("touchend", endTouch);
  stage.addEventListener("touchcancel", endTouch);

  // Two-finger trackpad swipe or a sideways-scrolling mouse on desktop.
  // One gesture moves one card. After a trackpad swipe the computer keeps
  // sending fading, slightly wobbly "coasting" signals for about a second;
  // those belong to the same swipe. A new swipe counts only when it comes at
  // least 350ms after the last one and its speed climbs well above the
  // coasting level (three times the slowest coasting signal seen).
  let wheelAccum = 0;
  let wheelLocked = false;
  let wheelTimer = null;
  let wheelAt = 0;
  let wheelPeak = 0;
  let wheelMin = Infinity;
  let wheelLast = 0;
  let wheelFaded = false;
  window.addEventListener("wheel", function (e) {
    if (deckScreen.hidden || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    const a = Math.abs(e.deltaX);
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(function () { wheelAccum = 0; wheelLocked = false; wheelLast = 0; }, 200);
    if (wheelLocked) {
      wheelPeak = Math.max(wheelPeak, a);
      if (a < wheelPeak * 0.5) wheelFaded = true;
      if (wheelFaded) wheelMin = Math.min(wheelMin, a);
      const fresh = wheelFaded && e.timeStamp - wheelAt >= 350 && a > wheelLast && a >= Math.max(10, 3 * wheelMin);
      wheelLast = a;
      if (!fresh) return;
      wheelLocked = false;
      wheelAccum = 0;
    }
    wheelLast = a;
    wheelAccum += e.deltaX;
    if (Math.abs(wheelAccum) >= 60) {
      wheelLocked = true;
      wheelAt = e.timeStamp;
      wheelPeak = a;
      wheelMin = Infinity;
      wheelFaded = false;
      swipe(wheelAccum > 0 ? 1 : -1);
      wheelAccum = 0;
    }
  }, { passive: false });

  // Phones: keep the answer box in view above the keyboard, and hide the
  // pinned Next bar while typing.
  answerInput.addEventListener("focus", function () {
    document.documentElement.classList.add("typing");
    if (document.documentElement.classList.contains("phone")) {
      setTimeout(function () { answerInput.scrollIntoView({ block: "center", behavior: "smooth" }); }, 300);
    }
  });
  answerInput.addEventListener("blur", function () { document.documentElement.classList.remove("typing"); });

  resetBtn.addEventListener("click", function () {
    known = new Set();
    learningMarked = new Set();
    passVisited = new Set();
    saveKnown();
    saveLearning();
    savePassVisited();
    render();
  });

  modeTabs.forEach(function (tab) {
    tab.addEventListener("click", function () { if (tab.dataset.mode !== mode) setMode(tab.dataset.mode); });
  });

  learnTabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      learnTabs.forEach(function (t) { t.classList.remove("active"); t.setAttribute("aria-selected", "false"); });
      tab.classList.add("active");
      tab.setAttribute("aria-selected", "true");
      cancelSlides();
      filter = tab.dataset.filter;
      pos = 0;
      flipped = false;
      if (QUIZ_BY_SET) { quiz = quizzes[filter] || null; inputFor = null; }
      render();
      if (QUIZ_BY_SET && quiz && quiz.phase === "card" && !quiz.answers[quiz.pos] && needsTyping()) answerInput.focus();
    });
  });

  // ---------- Name gate ----------
  function startDeck() {
    const v = nameInput.value.trim();
    if (!v) { nameError.textContent = "Please enter your name to begin."; nameInput.focus(); return; }
    nameError.textContent = "";
    try { localStorage.setItem(LAST_NAME_KEY, v); } catch (e) { /* ignore */ }
    loadStudent(v);
    order = CARDS.map(function (_, i) { return i; });
    filter = "all";
    pos = 0;
    flipped = false;
    learnTabs.forEach(function (t) {
      const isAll = t.dataset.filter === "all";
      t.classList.toggle("active", isAll);
      t.setAttribute("aria-selected", isAll ? "true" : "false");
    });
    studentNameEl.textContent = v;
    gateScreen.hidden = true;
    deckScreen.hidden = false;
    // Always open in Learn; an unfinished quiz resumes where it stopped
    // when the Quiz tab is tapped. Exercise Decks open the quiz on All.
    showHint = true;
    if (EXERCISE) { quiz = quizzes.all || null; setMode("quiz"); return; }
    setMode("learn");
  }

  beginBtn.addEventListener("click", startDeck);
  nameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") startDeck(); });

  switchStudentBtn.addEventListener("click", function () {
    deckScreen.hidden = true;
    gateScreen.hidden = false;
    nameInput.focus();
  });

  try {
    const last = localStorage.getItem(LAST_NAME_KEY) || (DECK.legacy && localStorage.getItem(DECK.legacy.nameKey));
    if (last) nameInput.value = last;
  } catch (e) { /* ignore */ }

  // ---------- Teacher dashboard (presenter mode, #teacher; claude.ai only) ----------
  function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }

  function passLabel(m) {
    if (m === "full") return "Full set";
    if (m === "missed") return "Missed retry";
    if (m === "learn") return "Learn pass";
    if (/^quiz round \d+/.test(m || "")) return "Quiz r" + m.slice(6);
    return m || "—";
  }

  let deckShownBeforeTeacher = false;

  function showScreen() {
    document.querySelectorAll(".presenter-only").forEach(function (el) { el.hidden = !presenterMode; });
    const wantTeacher = location.hash === "#teacher" && presenterMode;
    if (wantTeacher) {
      if (teacherScreen.hidden) {
        deckShownBeforeTeacher = !deckScreen.hidden;
        gateScreen.hidden = true;
        deckScreen.hidden = true;
        teacherScreen.hidden = false;
        renderTeacher();
      }
      return;
    }
    if (!teacherScreen.hidden) {
      teacherScreen.hidden = true;
      if (deckShownBeforeTeacher) { deckScreen.hidden = false; render(); }
      else gateScreen.hidden = false;
    }
  }

  function renderTeacher() {
    teacherScreen.innerHTML =
      '<header><h1>Teacher Dashboard</h1><div class="subtitle">' + esc(DECK.title) + '</div></header>' +
      '<hr class="rule" />' +
      '<p class="dash-hint">Every completed Learn pass and every quiz round is recorded as its own attempt. This view reads the claude.ai copy of the deck only; on GitHub the Google Sheet is the record. Anyone with this link can see this page.</p>' +
      '<div class="dash-panel"><h2>Class roster</h2>' +
        '<p class="dash-hint">One name per line, matched against attempts by name (not case-sensitive). Saving requires editor access.</p>' +
        '<textarea id="rosterBox" placeholder="Paste student names, one per line…"></textarea>' +
        '<div style="margin-top:10px;"><button class="nav-btn" id="saveRosterBtn">Save roster</button><span class="dash-status" id="rosterStatus"></span></div>' +
      '</div>' +
      '<div class="dash-panel"><div class="stat-row" id="statRow"></div></div>' +
      '<div class="dash-panel"><h2>Students</h2>' +
        '<p class="dash-hint">Attempt count and most recent result, one row per student. “Remove” permanently deletes all of that student’s attempt records; click once to arm it, then “Confirm”.</p>' +
        '<div class="dash-table-wrap" id="completedTable"><p class="dash-hint">Loading…</p></div>' +
        '<p class="dash-hint" id="removeStatus"></p>' +
      '</div>' +
      '<div class="dash-panel"><h2>Not yet attempted</h2>' +
        '<div id="missingList"><p class="dash-hint">Add a roster above to see this list.</p></div>' +
      '</div>' +
      '<div class="dash-panel"><h2>Word-level results</h2>' +
        '<p class="dash-hint">Right vs. wrong across every recorded attempt, worst-missed first.</p>' +
        '<div class="dash-table-wrap" id="wordTable"><p class="dash-hint">Loading…</p></div>' +
      '</div>' +
      '<footer><a href="#">&larr; Back to flashcards</a></footer>';

    let rosterNames = [];
    let attempts = [];
    let allAttempts = [];
    let pendingDelete = null;
    let dbRef = null;

    function normalize(s) { return (s || "").trim().toLowerCase(); }

    function studentRows() {
      const byName = {};
      attempts.forEach(function (a) {
        const key = normalize(a.name);
        if (!byName[key]) byName[key] = { name: a.name, count: 0, best: null, latest: null };
        byName[key].count++;
        if (byName[key].best === null || (a.correct != null && a.correct > byName[key].best)) byName[key].best = a.correct;
        if (!byName[key].latest || (a.completedAt || "") > (byName[key].latest.completedAt || "")) byName[key].latest = a;
      });
      return Object.keys(byName).map(function (k) { return byName[k]; });
    }

    function renderStats() {
      const rows = studentRows();
      const doneNames = rows.map(function (r) { return normalize(r.name); });
      const notYet = rosterNames.filter(function (n) { return doneNames.indexOf(normalize(n)) < 0; }).length;
      document.getElementById("statRow").innerHTML =
        '<div class="stat"><div class="n">' + attempts.length + '</div><div class="l">Attempts total</div></div>' +
        '<div class="stat"><div class="n">' + rows.length + '</div><div class="l">Students with an attempt</div></div>' +
        '<div class="stat"><div class="n">' + rosterNames.length + '</div><div class="l">On roster</div></div>' +
        '<div class="stat"><div class="n">' + notYet + '</div><div class="l">Not yet attempted</div></div>';
    }

    function renderCompleted() {
      const rows = studentRows();
      const box = document.getElementById("completedTable");
      if (!rows.length) { box.innerHTML = '<p class="dash-hint">No attempts yet.</p>'; return; }
      rows.sort(function (a, b) { return (b.latest.completedAt || "").localeCompare(a.latest.completedAt || ""); });
      const html = rows.map(function (r) {
        const when = r.latest.completedAt ? new Date(r.latest.completedAt).toLocaleString() : "—";
        const pass = (r.latest.passCorrect != null && r.latest.passSize != null) ? (r.latest.passCorrect + " / " + r.latest.passSize) : "—";
        const key = normalize(r.name);
        const action = pendingDelete === key
          ? '<button class="small-btn danger confirm-remove" data-name="' + esc(r.name || "") + '">Confirm</button> <button class="small-btn cancel-remove">Cancel</button>'
          : '<button class="small-btn remove-student" data-name="' + esc(r.name || "") + '">Remove</button>';
        return '<tr><td>' + esc(r.name || "—") + '</td><td>' + r.count + '</td><td>' + esc(passLabel(r.latest.passMode)) + ': ' + pass +
          '</td><td>' + (r.latest.correct != null ? r.latest.correct + " / " + (r.latest.total || N) : "—") +
          '</td><td>' + (r.best != null ? r.best + " / " + N : "—") + '</td><td>' + when + '</td><td>' + action + '</td></tr>';
      }).join("");
      box.innerHTML = '<table><thead><tr><th>Name</th><th>Attempts</th><th>Latest pass</th><th>Known now</th><th>Best known</th><th>Latest attempt</th><th></th></tr></thead><tbody>' + html + '</tbody></table>';
      box.onclick = function (ev) {
        const t = ev.target;
        if (!t || !t.classList) return;
        if (t.classList.contains("remove-student")) { pendingDelete = normalize(t.getAttribute("data-name")); renderCompleted(); }
        else if (t.classList.contains("cancel-remove")) { pendingDelete = null; renderCompleted(); }
        else if (t.classList.contains("confirm-remove")) { const nm = t.getAttribute("data-name"); pendingDelete = null; deleteStudent(nm); }
      };
    }

    function setRemoveStatus(msg) {
      const el = document.getElementById("removeStatus");
      if (el) el.textContent = msg || "";
    }

    function deleteStudent(name) {
      if (!dbRef) { setRemoveStatus("Not connected; try again in a moment."); return; }
      const key = normalize(name);
      const matching = allAttempts.filter(function (a) { return normalize(a.name) === key; });
      if (!matching.length) return;
      setRemoveStatus("Removing " + matching.length + " record" + (matching.length === 1 ? "" : "s") + " for " + name + "…");
      Promise.all(matching.map(function (a) { return dbRef.collection("attempts").doc(a._id).delete(); })).then(function () {
        setRemoveStatus("Removed " + name + " from the database.");
      }).catch(function () {
        setRemoveStatus("Couldn’t remove all records for " + name + "; try again.");
      });
    }

    function renderMissing() {
      const box = document.getElementById("missingList");
      if (!rosterNames.length) { box.innerHTML = '<p class="dash-hint">Add a roster above to see this list.</p>'; return; }
      const done = studentRows().map(function (r) { return normalize(r.name); });
      const missing = rosterNames.filter(function (n) { return done.indexOf(normalize(n)) < 0; });
      if (!missing.length) { box.innerHTML = '<p class="dash-hint">Everyone on the roster has at least one attempt.</p>'; return; }
      box.innerHTML = '<table><tbody>' + missing.map(function (n) { return '<tr><td>' + esc(n) + '</td><td><span class="pill no">not attempted</span></td></tr>'; }).join("") + '</tbody></table>';
    }

    function renderWordTable() {
      const stats = CARDS.map(function (c) { return { label: cardLabel(c), right: 0, wrong: 0 }; });
      attempts.forEach(function (a) {
        if (!Array.isArray(a.results) || !a.results.length) return;
        // Sparse [{i, r}, ...] for the cards in that pass; older records may be dense [true|false|null, ...].
        const sparse = typeof a.results[0] === "object" && a.results[0] !== null && "i" in a.results[0];
        if (sparse) {
          a.results.forEach(function (e) {
            if (!stats[e.i]) return;
            if (e.r === true) stats[e.i].right++; else if (e.r === false) stats[e.i].wrong++;
          });
        } else {
          a.results.forEach(function (r, i) {
            if (!stats[i]) return;
            if (r === true) stats[i].right++; else if (r === false) stats[i].wrong++;
          });
        }
      });
      const withData = stats.filter(function (s) { return s.right + s.wrong > 0; });
      const box = document.getElementById("wordTable");
      if (!withData.length) { box.innerHTML = '<p class="dash-hint">No scored attempts yet.</p>'; return; }
      withData.sort(function (a, b) {
        const pa = a.wrong / (a.right + a.wrong), pb = b.wrong / (b.right + b.wrong);
        return pb - pa || (b.wrong - a.wrong);
      });
      box.innerHTML = '<table><thead><tr><th>Word</th><th></th><th></th><th>% correct</th></tr></thead><tbody>' +
        withData.map(function (s) {
          const pct = Math.round(100 * s.right / (s.right + s.wrong));
          return '<tr><td>' + esc(s.label) + '</td><td><span class="pill yes">' + s.right + ' right</span></td><td><span class="pill no">' + s.wrong + ' wrong</span></td><td>' + pct + '%</td></tr>';
        }).join("") + '</tbody></table>';
    }

    dbP.then(function (db) {
      if (!db) {
        const msg = '<p class="dash-hint">This copy of the deck can’t reach the shared tracking data. Use the Google Sheet instead.</p>';
        document.getElementById("completedTable").innerHTML = msg;
        document.getElementById("wordTable").innerHTML = msg;
        return;
      }
      dbRef = db;
      db.doc("roster/list").get().then(function (snap) {
        if (snap.exists) {
          const data = snap.data();
          rosterNames = Array.isArray(data.names) ? data.names : [];
          document.getElementById("rosterBox").value = rosterNames.join("\n");
          renderStats(); renderMissing();
        }
      }).catch(function () {});

      db.collection("attempts").onSnapshot(function (snap) {
        allAttempts = snap.docs.map(function (d) { const o = d.data(); o._id = d.id; return o; });
        attempts = allAttempts.filter(function (a) { return a.completed !== false; });
        renderStats(); renderCompleted(); renderMissing(); renderWordTable();
      }, function () {
        document.getElementById("completedTable").innerHTML = '<p class="dash-hint">Couldn’t load attempts.</p>';
        document.getElementById("wordTable").innerHTML = '<p class="dash-hint">Couldn’t load attempts.</p>';
      });

      document.getElementById("saveRosterBtn").onclick = function () {
        const names = document.getElementById("rosterBox").value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
        const st = document.getElementById("rosterStatus");
        st.textContent = "Saving…"; st.className = "dash-status";
        db.doc("roster/list").set({ names: names, updatedAt: new Date().toISOString() }).then(function () {
          rosterNames = names;
          st.textContent = "Saved ✓"; st.className = "dash-status ok";
          renderStats(); renderMissing();
        }).catch(function (err) {
          st.textContent = (err && err.code === "invalid_argument") ? "You need editor access to save the roster." : "Couldn’t save; try again.";
          st.className = "dash-status err";
        });
      };
    });
  }

  window.addEventListener("hashchange", showScreen);
  showScreen();
</script>

</body>
</html>
