<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>{{TITLE}}</title>
<!-- Built from standard-deck/template.html by standard-deck/build.js.
     Edit the template or the deck's data file, then rebuild; do not edit this file by hand. -->
<style>
  :root {
    --paper: #efe7d8;
    --card: #fbf7ec;
    --card-back: #263248;
    --ink: #2a2f26;
    --ink-soft: #5a5648;
    --navy: #263248;
    --burgundy: #7a2e2e;
    --burgundy-dark: #5f2222;
    --sage: #5c6e4f;
    --sage-dark: #445238;
    --gold: #b08d57;
    --rule: #d8cbae;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 60px;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
  }

  .wrap.wide { max-width: 960px; }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-weight: 700;
    font-size: clamp(26px, 5vw, 34px);
    color: var(--navy);
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .rule {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 18px 0 20px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .tab {
    font-family: Georgia, serif;
    font-size: 14px;
    padding: 7px 16px;
    border: 1px solid var(--rule);
    background: var(--card);
    color: var(--ink-soft);
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .tab.active {
    background: var(--navy);
    color: var(--paper);
    border-color: var(--navy);
  }

  .mode-tabs { margin-bottom: 10px; }
  .mode-tabs .tab { min-width: 96px; }

  .sub-tabs .tab {
    font-size: 13px;
    padding: 5px 13px;
    border-radius: 6px;
  }

  .sub-tabs .tab.active {
    background: var(--card-back);
    border-color: var(--card-back);
  }

  .tab:focus-visible, button:focus-visible {
    outline: 2px solid var(--burgundy);
    outline-offset: 2px;
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--ink-soft);
    flex-wrap: wrap;
    gap: 8px;
    min-height: 31px;
  }

  .toolbar-right {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .icon-btn {
    background: none;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }

  .icon-btn:hover { background: rgba(0,0,0,0.04); }

  /* Progress bar */
  .progress-track {
    width: 100%;
    height: 5px;
    background: var(--rule);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 22px;
  }

  .progress-fill {
    height: 100%;
    background: var(--sage);
    width: 0%;
    transition: width 0.25s ease;
  }

  /* Card stage. Both faces sit in the same grid cell, so the card grows to
     fit whichever face is taller (the quiz back carries extra lines). */
  .stage {
    margin-bottom: 22px;
  }

  .card {
    position: relative;
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    cursor: pointer;
  }

  .card.no-flip { cursor: default; }

  .face {
    position: relative;
    grid-area: 1 / 1;
    min-width: 0;
    min-height: 300px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 34px 28px 28px;
    text-align: center;
    box-shadow: 0 8px 22px rgba(38, 50, 72, 0.18), 0 1px 0 rgba(0,0,0,0.04);
    transition: opacity 0.28s ease, transform 0.28s ease;
  }

  .face-front {
    background: var(--card);
    border: 1px solid var(--rule);
    opacity: 1;
    transform: scale(1);
    z-index: 2;
  }

  .face-back {
    background: var(--card-back);
    color: var(--paper);
    opacity: 0;
    transform: scale(0.97);
    z-index: 1;
    pointer-events: none;
  }

  .card.flipped .face-front {
    opacity: 0;
    transform: scale(0.97);
    z-index: 1;
    pointer-events: none;
  }

  .card.flipped .face-back {
    opacity: 1;
    transform: scale(1);
    z-index: 2;
    pointer-events: auto;
  }

  .category-tag {
    position: absolute;
    top: 14px;
    left: 16px;
    font-size: 11px;
    text-transform: none;
    letter-spacing: 0.3px;
    color: var(--gold);
    font-family: Georgia, serif;
    font-style: italic;
  }

  .term {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 700;
    color: var(--navy);
    line-height: 1.25;
    overflow-wrap: anywhere;
  }

  .hint {
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .meaning {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: clamp(20px, 4.5vw, 26px);
    font-style: italic;
    margin-bottom: 14px;
  }

  .examples {
    font-size: 14px;
    color: #d9dee8;
    max-width: 90%;
    line-height: 1.5;
  }

  .examples .examples-label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gold);
    margin-bottom: 6px;
  }

  /* Quiz: answer box on the front, feedback on the back */
  .quiz-form {
    width: 100%;
    max-width: 420px;
    margin-top: 18px;
  }

  .quiz-row {
    display: flex;
    gap: 8px;
  }

  .quiz-input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 15px;
    padding: 9px 12px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }

  .quiz-input:focus-visible {
    outline: 2px solid var(--burgundy);
    outline-offset: 2px;
  }

  .quiz-note {
    min-height: 18px;
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--burgundy);
  }

  .feedback {
    width: 100%;
    max-width: 90%;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(239, 231, 216, 0.22);
    font-size: 14px;
    line-height: 1.5;
    color: #d9dee8;
  }

  .your-answer { margin-bottom: 10px; overflow-wrap: anywhere; }
  .your-answer b { color: var(--paper); font-weight: 600; }

  .verdict {
    display: inline-block;
    font-weight: 700;
    font-size: 14px;
    padding: 4px 14px;
    border-radius: 999px;
  }

  .verdict.ok { background: #cfe3c4; color: #2f4a26; }
  .verdict.no { background: #f1d3d0; color: var(--burgundy-dark); }

  .verdict-reason {
    margin-top: 8px;
    font-size: 13px;
    color: #e9c9c5;
  }

  /* Quiz intro / between-rounds / finished screens */
  .quiz-panel {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: 0 8px 22px rgba(38, 50, 72, 0.18), 0 1px 0 rgba(0,0,0,0.04);
    min-height: 300px;
    padding: 34px 28px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }

  .panel-title {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: clamp(22px, 5vw, 28px);
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 12px;
  }

  .panel-score {
    font-family: Georgia, serif;
    font-size: 40px;
    font-weight: 700;
    color: var(--sage-dark);
    margin-bottom: 8px;
  }

  .panel-copy {
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink-soft);
    max-width: 440px;
    margin: 0 auto 22px;
  }

  .panel-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .secondary-btn {
    background: var(--card);
    color: var(--navy);
    border: 1px solid var(--navy);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }

  .secondary-btn:hover { background: #f3ecdc; }

  /* Mastery buttons */
  .mastery-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .mastery-btn {
    flex: 1;
    max-width: 220px;
    padding: 11px 10px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.1s ease, filter 0.15s ease;
  }

  .mastery-btn:active { transform: scale(0.97); }
  .mastery-btn:disabled { opacity: 0.35; cursor: default; transform: none; }

  .btn-learning {
    background: #f1e4d0;
    color: var(--burgundy-dark);
    border: 1px solid var(--burgundy);
  }
  .btn-learning:hover { filter: brightness(0.96); }

  .btn-known {
    background: var(--sage);
    color: var(--paper);
  }
  .btn-known:hover { background: var(--sage-dark); }

  .btn-known.active {
    box-shadow: inset 0 0 0 2px var(--sage-dark);
  }
  .btn-learning.active {
    box-shadow: inset 0 0 0 2px var(--burgundy-dark);
  }

  /* Nav row */
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-btn {
    background: var(--navy);
    color: var(--paper);
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }

  .nav-btn:hover { background: #1c2536; }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }

  .counter {
    font-size: 14px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .spacer { width: 1px; }

  footer {
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
  }

  footer button, footer a {
    background: none;
    border: none;
    color: var(--burgundy);
    text-decoration: underline;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    padding: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .face { transition: none; }
  }

  /* Name gate */
  .gate-copy {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.5;
    margin: 0 auto 20px;
    max-width: 460px;
  }

  .gate-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .name-input {
    font-family: inherit;
    font-size: 15px;
    padding: 9px 14px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    min-width: 240px;
  }

  .name-input:focus-visible {
    outline: 2px solid var(--burgundy);
    outline-offset: 2px;
  }

  .gate-error {
    text-align: center;
    color: var(--burgundy);
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 6px;
  }

  /* Teacher dashboard (presenter mode only) */
  .dash-panel {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 18px;
  }

  .dash-panel h2 {
    font-family: Georgia, serif;
    font-size: 19px;
    color: var(--navy);
    margin: 0 0 4px;
  }

  .dash-hint { color: var(--ink-soft); font-size: 13px; margin: 0 0 12px; }
  .dash-status { font-size: 13px; color: var(--ink-soft); margin-left: 10px; }
  .dash-status.ok { color: var(--sage-dark); }
  .dash-status.err { color: var(--burgundy); }

  .dash-panel textarea {
    width: 100%;
    min-height: 140px;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    resize: vertical;
  }

  .stat-row { display: flex; gap: 22px; flex-wrap: wrap; }
  .stat .n { font-family: Georgia, serif; font-size: 26px; font-weight: 700; color: var(--navy); }
  .stat .l { font-size: 11.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.6px; }

  .dash-table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 9px; border-bottom: 1px solid var(--rule); }
  th { font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }

  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
  .pill.yes { background: #dfe8d6; color: var(--sage-dark); }
  .pill.no { background: #f1dcd8; color: var(--burgundy-dark); }

  .small-btn {
    background: none;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12.5px;
    cursor: pointer;
    font-family: inherit;
  }

  .small-btn.danger { border-color: var(--burgundy); color: var(--burgundy); }

  /* Name line: "Studying as NAME (switch)" */
  .switch-link {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-style: normal;
    color: var(--burgundy);
    text-decoration: underline;
    cursor: pointer;
  }

  /* 16px text keeps iPhone Safari from zooming in on the inputs. */
  .name-input, .quiz-input { font-size: 16px; }

  /* Sideways swipes move between cards, so the browser's own
     back/forward swipe is switched off on this page. */
  html, body { overscroll-behavior-x: none; }

  /* No double-tap zoom (rapid taps on buttons zoomed the page on iPhone);
     pinch zoom still works. */
  * { touch-action: manipulation; }

  .card { touch-action: pan-y; }
  /* Cards move as a filmstrip: the incoming card is a copy that travels
     beside the current one with a fixed gap, then the real card takes over. */
  .stage { position: relative; }
  .card.peek { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; }
  html, body { overflow-x: clip; }
  .card.dragging, .card.dragging .face { transition: none; }

  /* Touchscreens (phones and tablets): swipe instead of Prev/Next. */
  .touch #prevBtn, .touch #nextBtn { display: none; }
  .touch #learnControls .nav-row { justify-content: center; }
  .touch #footerHelp, .touch .footer-sep { display: none; }

  /* Small screens: compact header and a card that fits. */
  @media (max-width: 600px) {
    body { padding: 12px 14px 40px; }
    header { margin-bottom: 8px; }
    h1 { font-size: 24px; margin-bottom: 2px; }
    .subtitle { font-size: 13px; }
    .rule { margin: 8px 0 12px; }
    .tabs { margin-bottom: 10px; }
    .mode-tabs { margin-bottom: 8px; }
    .toolbar { margin-bottom: 10px; flex-wrap: nowrap; min-height: 0; }
    .icon-btn { padding: 5px 9px; font-size: 12.5px; }
    .progress-track { margin-bottom: 14px; }
    .face { min-height: 250px; padding: 30px 18px 22px; }
    .quiz-panel { min-height: 250px; padding: 28px 18px; margin-bottom: 14px; }
    .stage { margin-bottom: 14px; }
    .mastery-row { margin-bottom: 12px; }
    footer { margin-top: 18px; }
  }

  /* Phones: the action buttons sit at the bottom of the screen. */
  .phone .mastery-row, .phone #quizControls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    margin: 0;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: var(--paper);
    border-top: 1px solid var(--rule);
    box-shadow: 0 -4px 12px rgba(38, 50, 72, 0.08);
  }
  .phone .mastery-btn { max-width: none; }
  .phone .face, .phone .quiz-panel { min-height: var(--fit-h, 250px); }
  .phone body { padding-bottom: 0; }
  .phone #deckScreen { padding-bottom: calc(66px + env(safe-area-inset-bottom)); }
  .phone #deckScreen footer { margin-top: 0; }
  .phone.typing #quizControls { display: none; }

  /* Exercise Decks (Quiz only): the exercise's instruction, the question,
     tappable answer options, and the answer on the back. */
  .ex-instr {
    font-size: 13px;
    font-style: italic;
    color: var(--ink-soft);
    line-height: 1.45;
    max-width: 460px;
    margin: 6px 0 12px;
  }
  .ex-instr .base-line { display: block; font-style: normal; color: var(--navy); margin-top: 3px; }
  .ex-instr .bank { display: block; font-style: normal; margin-top: 6px; }
  .exercise .term { font-size: clamp(24px, 5.5vw, 34px); }
  .prompt {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink);
    max-width: 460px;
  }
  .prompt .line { margin: 4px 0 10px; }
  .prompt .line-label {
    display: block;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gold);
  }
  .prompt .ask { font-size: 14px; font-style: italic; color: var(--ink-soft); margin-top: 6px; }
  .choices {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 460px;
    margin-top: 14px;
  }
  .choices.long { max-width: 620px; }
  @media (min-width: 601px) { .choices.long { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .choice {
    display: flex;
    gap: 8px;
    align-items: baseline;
    text-align: left;
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.35;
    padding: 9px 12px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .choices.long .choice { font-size: 14px; padding: 7px 10px; }
  .choice:hover { border-color: var(--navy); }
  .choice .opt-key { font-weight: 700; color: var(--navy); flex: none; }
  .choice:disabled { cursor: default; opacity: 0.6; }
  .choice.picked { border-color: var(--burgundy); opacity: 1; }
  .answer-key { font-style: normal; font-weight: 700; margin-right: 6px; }
  .back-word { font-style: normal; font-weight: 700; font-size: clamp(24px, 5.5vw, 32px); margin-bottom: 10px; }
  .back-text { font-style: normal; font-size: 15px; line-height: 1.45; color: #d9dee8; margin-bottom: 10px; }
  .back-note { font-size: 14px; color: #d9dee8; margin-top: -4px; }
  /* Phones: the exercise tabs sit in one row that scrolls sideways, and a
     long list of options scrolls inside the card. */
  .phone.exercise .sub-tabs { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; padding-bottom: 2px; scrollbar-width: none; }
  .phone.exercise .sub-tabs::-webkit-scrollbar { display: none; }
  .phone.exercise .sub-tabs .tab { flex: none; }
  .phone.exercise .ex-instr { margin: 2px 0 8px; }
  .phone.exercise .face { padding-top: 34px; }
  .phone .choices.long { max-height: 40vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-right: 2px; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="wrap" id="gateScreen">
  <header>
    <h1 class="title-tap">{{TITLE}}</h1>
  </header>

  <hr class="rule" />

  <div class="gate-copy" id="gateCopy">
    Enter your name to begin. Your progress is saved on this device, and a short summary is sent to your teacher each time you finish the full list or a quiz round.
  </div>

  <div class="gate-row">
    <input type="text" id="nameInput" class="name-input" placeholder="Your full name" autocomplete="off" />
    <button class="nav-btn" id="beginBtn">Begin &rarr;</button>
  </div>
  <div class="gate-error" id="nameError"></div>
  <footer class="presenter-only" hidden><a href="#teacher">Teacher dashboard</a></footer>
</div>

<div class="wrap" id="deckScreen" hidden>
  <header>
    <h1 class="title-tap">{{TITLE}}</h1>
    <div class="subtitle name-line">Studying as <span id="studentName"></span> <button class="switch-link" id="switchStudentBtn">(switch)</button></div>
  </header>

  <hr class="rule" />

  <div class="tabs mode-tabs" role="tablist" aria-label="Mode">
    <button class="tab active" data-mode="learn" role="tab" aria-selected="true">Learn</button>
    <button class="tab" data-mode="quiz" role="tab" aria-selected="false">Quiz</button>
  </div>

  <div class="tabs sub-tabs" id="learnTabs" role="tablist" aria-label="Card set"></div>

  <div class="toolbar">
    <span id="statusText"></span>
    <div class="toolbar-right" id="learnTools">
      <button class="icon-btn" id="shuffleBtn">Shuffle</button>
      <button class="icon-btn" id="resetBtn">Reset progress</button>
    </div>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="quiz-panel" id="quizPanel" hidden></div>

  <div class="stage" id="stage">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard, tap or press Enter to flip">
      <div class="face face-front">
        <div class="category-tag" id="tagFront"></div>
        <div class="ex-instr" id="exInstr" hidden></div>
        <div class="term" id="termFront"></div>
        <div class="prompt" id="promptFront" hidden></div>
        <div class="choices" id="choiceList" hidden></div>
        <div class="hint" id="hintFront">Tap card to reveal meaning</div>
        <div class="quiz-form" id="quizForm" hidden>
          <div class="quiz-row">
            <input type="text" id="answerInput" class="quiz-input" placeholder="Type the meaning" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" />
            <button class="nav-btn" id="checkBtn">Check</button>
          </div>
          <div class="quiz-note" id="quizNote"></div>
        </div>
      </div>
      <div class="face face-back">
        <div class="category-tag" id="tagBack" style="color:#c9b98a;"></div>
        <div class="meaning" id="meaningBack"></div>
        <div class="examples" id="originBox"><span class="examples-label" id="originLabel"></span><span id="originBack"></span></div>
        <div class="feedback" id="feedbackBox" hidden>
          <div class="your-answer">Your answer: <b id="yourAnswer"></b></div>
          <span class="verdict" id="verdict"></span>
          <div class="verdict-reason" id="verdictReason" hidden></div>
        </div>
      </div>
    </div>
  </div>

  <div id="learnControls">
    <div class="mastery-row">
      <button class="mastery-btn btn-learning" id="learningBtn">Still learning</button>
      <button class="mastery-btn btn-known" id="knownBtn">Know it</button>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn">&larr; Prev</button>
      <span class="counter" id="counter"></span>
      <button class="nav-btn" id="nextBtn">Next &rarr;</button>
    </div>
  </div>

  <div class="nav-row" id="quizControls" hidden>
    <span class="spacer"></span>
    <span class="counter" id="quizCounter"></span>
    <button class="nav-btn" id="quizNextBtn">Next &rarr;</button>
  </div>

  <footer>
    <span id="footerHelp"></span><span class="presenter-only" hidden><span class="footer-sep"> &middot; </span><a href="#teacher">Teacher dashboard</a></span>
  </footer>
</div>

<div class="wrap wide" id="teacherScreen" hidden></div>

<script>
  // ---------- Deck content (from standard-deck/decks/) ----------
  const DECK = {{DECK_JSON}};

  const CARDS = DECK.cards;
  const N = CARDS.length;
  const ID = DECK.id;
  // Touchscreens (phones and tablets) swipe between cards.
  const TOUCH = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
  // Exercise Decks have Quiz mode only. Each card is a question: "choice"
  // (tap one option) or "typed" (type the word or base). The quiz covers the
  // selected tab (All, one exercise, or Missed), and each tab's unfinished
  // quiz resumes where it stopped.
  const EXERCISE = DECK.type === "exercise";
  const QUIZ_BY_SET = EXERCISE;
  const CATS = {};
  (DECK.categories || []).forEach(function (c) { CATS[c.key] = c; });

  // ---------- Answer judging ----------
  // A typed answer is correct when, for at least one of the word's senses,
  // it contains a key term from every required group (or a ★ term, which
  // covers all groups of its sense) and no key term that belongs ONLY to
  // other words in this deck. A term that also belongs to this word (in any
  // group, ★ or its accepted list) never triggers that penalty, so lists
  // may overlap. Accepted terms fit the meaning without being required;
  // generic groups and a card's everyday terms never trigger the penalty
  // on other cards.
  const MAX_ANSWER_WORDS = 12;

  function norm(s) {
    return (s || "").toLowerCase()
      .replace(/[‘’ʼ`']/g, "")
      .replace(/[^a-z0-9]+/g, " ")
      .trim();
  }

  function toTokens(s) {
    const n = norm(s);
    return n ? n.split(" ") : [];
  }

  const IRREGULAR = { women: "woman", men: "man", wives: "wife", lives: "life" };
  const SUFFIXES = [
    "ibility", "ability", "ically", "ations", "nesses", "ation", "ities", "ments", "ships",
    "ness", "ment", "ship", "able", "ible", "ings", "ions", "ives", "ists", "isms", "ical",
    "ing", "ion", "ive", "ist", "ism", "ous", "ful", "ity", "ers", "ors",
    "ty", "er", "or", "ed", "ly", "ic"
  ];

  function stemOnce(w) {
    if (IRREGULAR[w]) return IRREGULAR[w];
    if (w.length > 4 && /ie[sd]$/.test(w)) return w.slice(0, -3) + "y";
    if (/(ss|x|z|ch|sh)es$/.test(w) && w.length > 4) return w.slice(0, -2);
    for (const suf of SUFFIXES) {
      if (!w.endsWith(suf)) continue;
      let s = w.slice(0, -suf.length);
      const min = (suf === "ing" || suf === "ed") ? 3 : 4;
      if (s.length < min) continue;
      // winning -> win, stopped -> stop (but keep obsess, fall, puff, buzz)
      if ((suf === "ing" || suf === "ed" || suf === "er") && /([^aeiouslfz])\1$/.test(s)) s = s.slice(0, -1);
      return s;
    }
    if (w.length > 3 && w.endsWith("s") && !/(ss|us|is)$/.test(w)) return w.slice(0, -1);
    if (w.length > 4 && w.endsWith("e")) return w.slice(0, -1);
    if (w.length > 4 && w.endsWith("y")) return w.slice(0, -1);
    return w;
  }

  function stem(w) {
    let s = w;
    for (let k = 0; k < 3; k++) {
      const t = stemOnce(s);
      if (t === s) break;
      s = t;
    }
    return s;
  }

  // True when a and b differ by at most one insertion, deletion, substitution
  // or swap of neighboring letters.
  function withinOneEdit(a, b) {
    if (a === b) return true;
    const la = a.length, lb = b.length;
    if (Math.abs(la - lb) > 1) return false;
    if (la === lb) {
      const diffs = [];
      for (let i = 0; i < la; i++) if (a[i] !== b[i]) { diffs.push(i); if (diffs.length > 2) return false; }
      if (diffs.length === 1) return true;
      return diffs.length === 2 && diffs[1] === diffs[0] + 1 && a[diffs[0]] === b[diffs[1]] && a[diffs[1]] === b[diffs[0]];
    }
    const s = la < lb ? a : b, l = la < lb ? b : a;
    let i = 0, j = 0, skipped = false;
    while (i < s.length && j < l.length) {
      if (s[i] === l[j]) { i++; j++; continue; }
      if (skipped) return false;
      skipped = true; j++;
    }
    return true;
  }

  const stemCache = {};
  function stemC(w) { return stemCache[w] || (stemCache[w] = stem(w)); }

  // Does the student's word count as this key-word? Other forms of a word
  // count (protect / protection), and when giving credit (loose) a
  // one-letter slip is also forgiven in key words of six or more letters.
  // The other-word penalty uses the strict form only, so a near-miss real
  // word (anger / danger) never costs a student the card.
  function wordMatches(ans, key, loose) {
    if (ans === key) return true;
    const sa = stemC(ans), sk = stemC(key);
    if (sa === sk) return true;
    if (!loose) return false;
    const lo = sa.length <= sk.length ? sa : sk;
    const hi = lo === sa ? sk : sa;
    if (lo.length >= 5 && hi.startsWith(lo) && hi.length - lo.length <= 2) return true;
    return key.length >= 6 && withinOneEdit(ans, key);
  }

  // Every place a key term (one or more words) appears in the answer, as
  // [start, end) token spans. A multi-word term may have one extra word
  // inside it ("out of his reach"), and hyphenated or split spellings match
  // either way ("arch enemy" / "archenemy").
  function findTerm(ans, term, loose) {
    const spans = [];
    const t = term.toks;
    const m = function (a, k) { return wordMatches(a, k, loose); };
    for (let i = 0; i < ans.length; i++) {
      if (t.length === 1) {
        if (m(ans[i], t[0])) spans.push([i, i + 1]);
        else if (i + 1 < ans.length && t[0].length >= 6 && m(ans[i] + ans[i + 1], t[0])) spans.push([i, i + 2]);
        continue;
      }
      if (t.join("").length >= 6 && m(ans[i], t.join(""))) { spans.push([i, i + 1]); continue; }
      if (!m(ans[i], t[0])) continue;
      let j = i + 1, gap = false, ok = true;
      for (let k = 1; k < t.length; k++) {
        if (j < ans.length && m(ans[j], t[k])) { j++; continue; }
        if (!gap && j + 1 < ans.length && m(ans[j + 1], t[k])) { gap = true; j += 2; continue; }
        ok = false; break;
      }
      if (ok) spans.push([i, j]);
    }
    return spans;
  }

  function prepTerm(s) { return { text: s, toks: toTokens(s) }; }

  CARDS.forEach(function (c) {
    if (!c.senses) { c.accepted = []; c.ownTerms = []; c.penaltyTerms = []; return; }
    c.senses.forEach(function (sense) {
      sense.groups.forEach(function (g) { g.terms = g.terms.map(prepTerm); });
      sense.star = (sense.star || []).map(prepTerm);
    });
    c.accepted = (c.accepted || []).map(prepTerm);
    const everyday = (c.everyday || []).map(norm);
    // Every term of this card, for the "does it also belong here?" check.
    c.ownTerms = c.accepted.slice();
    // The terms that count against an answer to a different card.
    c.penaltyTerms = [];
    c.senses.forEach(function (sense) {
      sense.star.forEach(function (t) { c.ownTerms.push(t); c.penaltyTerms.push(t); });
      sense.groups.forEach(function (g) {
        g.terms.forEach(function (t) {
          c.ownTerms.push(t);
          if (!g.generic && everyday.indexOf(norm(t.text)) < 0) c.penaltyTerms.push(t);
        });
      });
    });
  });

  // Same term, allowing other forms of each word (protect / protection).
  function sameTerm(a, b) {
    if (a.toks.length !== b.toks.length) return false;
    return a.toks.every(function (w, k) { return wordMatches(w, b.toks[k], false); });
  }

  function judge(cardIdx, text) {
    const ans = toTokens(text);
    if (!ans.length) return { empty: true };
    if (ans.length > MAX_ANSWER_WORDS) return { tooLong: true };
    const card = CARDS[cardIdx];
    const ownSpans = [];
    card.accepted.forEach(function (t) { findTerm(ans, t, true).forEach(function (sp) { ownSpans.push(sp); }); });
    let ok = false;
    card.senses.forEach(function (sense) {
      const all = sense.star.slice();
      sense.groups.forEach(function (g) { g.terms.forEach(function (t) { all.push(t); }); });
      all.forEach(function (t) { findTerm(ans, t, true).forEach(function (sp) { ownSpans.push(sp); }); });
      const starHit = sense.star.some(function (t) { return findTerm(ans, t, true).length > 0; });
      const groupsHit = sense.groups.every(function (g) {
        return g.terms.some(function (t) { return findTerm(ans, t, true).length > 0; });
      });
      if (starHit || groupsHit) ok = true;
    });
    function covered(sp) {
      return ownSpans.some(function (o) { return o[0] <= sp[0] && o[1] >= sp[1]; });
    }
    let mixed = null;
    for (let j = 0; j < N && !mixed; j++) {
      if (j === cardIdx) continue;
      CARDS[j].penaltyTerms.forEach(function (t) {
        if (mixed) return;
        if (card.ownTerms.some(function (o) { return sameTerm(o, t); })) return;
        if (findTerm(ans, t, false).some(function (sp) { return !covered(sp); })) mixed = CARDS[j].word;
      });
    }
    return { ok: ok && !mixed, mixed: mixed };
  }

  // Exercise Decks: a tapped option is right when it is the answer; a typed
  // answer is right when it is one of the accepted answers, ignoring case,
  // accents, hyphens and brackets ("dom-", "DOM(IN)-" and "domin" all name
  // DOM(IN)-). Several forms of the same base may be typed together.
  function answerPieces(s) {
    return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
      .replace(/[()\[\]\-\u2010-\u2014.'\u2019"\u201c\u201d]/g, "")
      .split(/[\s,;\/]+/).filter(function (w) { return w && w !== "or" && w !== "and"; });
  }

  function judgeExercise(cardIdx, response) {
    const card = CARDS[cardIdx];
    if (card.kind === "choice") return { ok: response === card.answer };
    const got = answerPieces(response);
    if (!got.length) return { empty: true };
    const accept = [];
    (card.accept || []).forEach(function (a) { answerPieces(a).forEach(function (w) { accept.push(w); }); });
    // A one-word answer must match exactly; a list of base forms must all be
    // forms of the right base.
    const whole = answerPieces(response).join(" ");
    const ok = (card.accept || []).some(function (a) { return answerPieces(a).join(" ") === whole; }) ||
      (card.gloss && got.every(function (w) { return accept.indexOf(w) >= 0; }));
    return { ok: !!ok };
  }

  function cardOptions(item) {
    return item.options || (CATS[item.cat] && CATS[item.cat].options) || [];
  }

  // "(A)", "A." or nothing, by the exercise's style.
  function optionKey(item, k) {
    const style = item.optionStyle || (CATS[item.cat] && CATS[item.cat].optionStyle) || "paren";
    const L = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[k];
    if (style === "letters") return L + ".";
    if (style === "paren") return "(" + L + ")";
    return "";
  }

  // The student's answer (or the right one) as text, for the card and the Sheet.
  function answerText(item, a) {
    if (item.kind !== "choice") return String(a);
    const opt = cardOptions(item)[a];
    const key = optionKey(item, a);
    return (key ? key + " " : "") + (opt == null ? "" : opt);
  }

  function cardLabel(item) { return item.word || item.label || ""; }

  // ---------- Student identity & per-student storage ----------
  // Learn and Quiz share one Know it / Still learning record per student.
  function slug(s) {
    return (s || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "student";
  }

  function storageKeys(sl) {
    return {
      known: ID + "_known_v1__" + sl,
      learning: ID + "_learning_v1__" + sl,
      visited: ID + "_passVisited_v1__" + sl,
      quiz: ID + "_quiz_v1__" + sl,
      quizzes: ID + "_quizzes_v1__" + sl
    };
  }

  const LAST_NAME_KEY = ID + "_lastName";

  let currentName = "";
  let currentSlug = "student";
  let known = new Set();
  let learningMarked = new Set();
  let passVisited = new Set(); // cards seen in the current pass through the "All" list
  let quiz = null;             // the quiz in progress, or null
  let quizzes = {};            // Exercise Decks: the quiz for each tab

  function validIdx(i) { return Number.isInteger(i) && i >= 0 && i < N; }

  function loadStudent(name) {
    currentName = name;
    currentSlug = slug(name);
    const keys = storageKeys(currentSlug);
    known = new Set();
    learningMarked = new Set();
    passVisited = new Set();
    quiz = null;
    quizzes = {};
    let hadRecord = false;
    try {
      const rawK = localStorage.getItem(keys.known);
      if (rawK) { known = new Set(JSON.parse(rawK).filter(validIdx)); hadRecord = true; }
      const rawL = localStorage.getItem(keys.learning);
      if (rawL) { learningMarked = new Set(JSON.parse(rawL).filter(validIdx)); hadRecord = true; }
      const rawV = localStorage.getItem(keys.visited);
      if (rawV) passVisited = new Set(JSON.parse(rawV).filter(validIdx));
      if (QUIZ_BY_SET) {
        quizzes = {};
        const rawM = JSON.parse(localStorage.getItem(keys.quizzes) || "null") || {};
        Object.keys(rawM).forEach(function (k) {
          const q = validQuiz(rawM[k]);
          if (q && q.set === k) quizzes[k] = q;
        });
      } else {
        const rawQ = localStorage.getItem(keys.quiz);
        if (rawQ) quiz = validQuiz(JSON.parse(rawQ));
      }
    } catch (e) { /* storage unavailable, proceed without persistence */ }
    if (!hadRecord) carryOverLegacy();
  }

  // The earlier self-graded version of this deck kept "I had it" / "I missed
  // it" per card; bring those across once as Know it / Still learning.
  function carryOverLegacy() {
    if (!DECK.legacy) return;
    try {
      const old = JSON.parse(localStorage.getItem(DECK.legacy.progressKey) || "null");
      if (!old || slug(old.name) !== currentSlug || !Array.isArray(old.results) || old.results.length !== N) return;
      old.results.forEach(function (r, i) {
        if (r === true) known.add(i);
        else if (r === false) learningMarked.add(i);
      });
      if (known.size || learningMarked.size) { saveKnown(); saveLearning(); }
    } catch (e) { /* ignore */ }
  }

  function validQuiz(q) {
    if (!q || !Array.isArray(q.order) || !q.order.length || !q.order.every(validIdx)) return null;
    if (!Array.isArray(q.answers) || q.answers.length !== q.order.length) return null;
    if (["card", "between", "done"].indexOf(q.phase) < 0) return null;
    q.pos = Math.min(Math.max(0, q.pos | 0), q.order.length - 1);
    q.round = Math.max(1, q.round | 0);
    return q;
  }

  function saveKnown() {
    try { localStorage.setItem(storageKeys(currentSlug).known, JSON.stringify([...known])); }
    catch (e) { /* ignore */ }
  }

  function saveLearning() {
    try { localStorage.setItem(storageKeys(currentSlug).learning, JSON.stringify([...learningMarked])); }
    catch (e) { /* ignore */ }
  }

  function savePassVisited() {
    try { localStorage.setItem(storageKeys(currentSlug).visited, JSON.stringify([...passVisited])); }
    catch (e) { /* ignore */ }
  }

  function saveQuiz() {
    if (QUIZ_BY_SET) {
      if (quiz) quizzes[quiz.set] = quiz;
      try { localStorage.setItem(storageKeys(currentSlug).quizzes, JSON.stringify(quizzes)); }
      catch (e) { /* ignore */ }
      return;
    }
    try {
      const k = storageKeys(currentSlug).quiz;
      if (quiz) localStorage.setItem(k, JSON.stringify(quiz));
      else localStorage.removeItem(k);
    } catch (e) { /* ignore */ }
  }

  // ---------- Presenter mode (five quick taps on the title) ----------
  let presenterMode = false;
  try { presenterMode = sessionStorage.getItem(ID + "_pm") === "1"; } catch (e) { /* ignore */ }

  let tapCount = 0, tapTimer = null;
  document.querySelectorAll(".title-tap").forEach(function (el) {
    el.addEventListener("click", function () {
      tapCount++;
      if (tapTimer) clearTimeout(tapTimer);
      tapTimer = setTimeout(function () { tapCount = 0; }, 2200);
      if (tapCount < 5) return;
      tapCount = 0;
      presenterMode = !presenterMode;
      try { sessionStorage.setItem(ID + "_pm", presenterMode ? "1" : ""); } catch (e) { /* ignore */ }
      el.style.transition = "color .2s";
      el.style.color = presenterMode ? "var(--sage)" : "var(--burgundy)";
      setTimeout(function () { el.style.color = ""; }, 500);
      showScreen();
    });
  });

  // ---------- Reporting ----------
  // Every completed pass writes one row to the Google Sheet (through the
  // Form). On claude.ai the same pass is also stored in the artifact
  // database for the teacher dashboard. Nothing here is ever shown to the
  // student, and nothing is sent in presenter mode.
  const GFORM_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLScRTznZybZBwbPW09lN3yGgdhbjKjGu03gU1t92h9_DLY7kOw/formResponse";
  const GFORM_FIELDS = {
    deck: "entry.959320872",
    name: "entry.776497888",
    passMode: "entry.693423775",
    passScore: "entry.1886216116",
    passSize: "entry.367439227",
    cumCorrect: "entry.1206079657",
    cumTotal: "entry.853509881",
    resultsJson: "entry.211011489"
  };

  function sendToSheet(payload) {
    try {
      const sinkId = "gform_sink";
      let iframe = document.getElementById(sinkId);
      if (!iframe) {
        iframe = document.createElement("iframe");
        iframe.name = sinkId;
        iframe.id = sinkId;
        iframe.style.display = "none";
        document.body.appendChild(iframe);
      }
      const form = document.createElement("form");
      form.action = GFORM_ACTION;
      form.method = "POST";
      form.target = sinkId;
      form.style.display = "none";
      Object.keys(payload).forEach(function (key) {
        const fieldName = GFORM_FIELDS[key];
        if (!fieldName) return;
        const input = document.createElement("input");
        input.name = fieldName;
        input.value = String(payload[key]);
        form.appendChild(input);
      });
      document.body.appendChild(form);
      form.submit();
      setTimeout(function () { if (form.parentNode) form.parentNode.removeChild(form); }, 3000);
    } catch (e) { /* best-effort only — never block the student's flow */ }
  }

  const dbP = (window.claude && window.claude.use) ? window.claude.use("db").catch(function () { return null; }) : Promise.resolve(null);

  function recordAttempt(row) {
    dbP.then(function (db) {
      if (!db) return;
      const now = new Date().toISOString();
      return db.collection("attempts").doc().set({
        name: currentName.trim(), nameSlug: currentSlug,
        passMode: row.passMode, passSize: row.passSize, passCorrect: row.passCorrect,
        completed: true, correct: known.size, total: N,
        results: row.results, answers: row.answers || null,
        updatedAt: now, completedAt: now
      });
    }).catch(function () { /* the Sheet row is the record; stay silent */ });
  }

  function reportPass(row) {
    if (presenterMode) return;
    sendToSheet({
      deck: DECK.title,
      name: currentName.trim(),
      passMode: row.passMode,
      passScore: row.passCorrect + "/" + row.passSize,
      passSize: row.passSize,
      cumCorrect: known.size,
      cumTotal: N,
      resultsJson: JSON.stringify(row.json)
    });
    recordAttempt(row);
  }

  // ---------- Elements ----------
  const gateScreen = document.getElementById("gateScreen");
  const deckScreen = document.getElementById("deckScreen");
  const teacherScreen = document.getElementById("teacherScreen");
  const nameInput = document.getElementById("nameInput");
  const beginBtn = document.getElementById("beginBtn");
  const nameError = document.getElementById("nameError");
  const switchStudentBtn = document.getElementById("switchStudentBtn");
  const modeTabs = document.querySelectorAll(".mode-tabs .tab");
  const learnTabsEl = document.getElementById("learnTabs");
  const learnTools = document.getElementById("learnTools");
  const statusText = document.getElementById("statusText");
  const progressFill = document.getElementById("progressFill");
  const quizPanel = document.getElementById("quizPanel");
  const stage = document.getElementById("stage");
  const cardEl = document.getElementById("card");
  const tagFront = document.getElementById("tagFront");
  const termFront = document.getElementById("termFront");
  const hintFront = document.getElementById("hintFront");
  const quizForm = document.getElementById("quizForm");
  const answerInput = document.getElementById("answerInput");
  const checkBtn = document.getElementById("checkBtn");
  const quizNote = document.getElementById("quizNote");
  const tagBack = document.getElementById("tagBack");
  const meaningBack = document.getElementById("meaningBack");
  const originBox = document.getElementById("originBox");
  const originLabel = document.getElementById("originLabel");
  const originBack = document.getElementById("originBack");
  const feedbackBox = document.getElementById("feedbackBox");
  const yourAnswer = document.getElementById("yourAnswer");
  const verdictEl = document.getElementById("verdict");
  const verdictReason = document.getElementById("verdictReason");
  const learnControls = document.getElementById("learnControls");
  const quizControls = document.getElementById("quizControls");
  const counterEl = document.getElementById("counter");
  const quizCounter = document.getElementById("quizCounter");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const quizNextBtn = document.getElementById("quizNextBtn");
  const knownBtn = document.getElementById("knownBtn");
  const learningBtn = document.getElementById("learningBtn");
  const shuffleBtn = document.getElementById("shuffleBtn");
  const resetBtn = document.getElementById("resetBtn");
  const footerHelp = document.getElementById("footerHelp");
  const studentNameEl = document.getElementById("studentName");
  const exInstr = document.getElementById("exInstr");
  const promptFront = document.getElementById("promptFront");
  const choiceList = document.getElementById("choiceList");

  if (EXERCISE) {
    document.documentElement.classList.add("exercise");
    document.querySelector(".mode-tabs").hidden = true;
    document.getElementById("gateCopy").textContent = "Enter your name to begin. Your progress is saved on this device, and a short summary is sent to your teacher each time you finish a quiz round.";
  }

  originLabel.textContent = DECK.backLabel || "Origin";

  // Learn sub-tabs: All, the deck's own categories (if any), Still Learning.
  const CATEGORIES = DECK.categories || [];
  learnTabsEl.innerHTML = "";
  [{ key: "all", label: "All" }].concat(CATEGORIES, [{ key: "learning", label: EXERCISE ? "Missed" : "Still Learning" }]).forEach(function (t, k) {
    const b = document.createElement("button");
    b.className = "tab" + (k === 0 ? " active" : "");
    b.dataset.filter = t.key;
    b.dataset.label = t.label;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", k === 0 ? "true" : "false");
    learnTabsEl.appendChild(b);
  });
  const learnTabs = learnTabsEl.querySelectorAll(".tab");

  let mode = "learn";
  let order = CARDS.map(function (_, i) { return i; });
  let filter = "all";
  let pos = 0;
  let flipped = false;
  let showHint = true;

  // ---------- Learn mode (the Latin Roots behavior) ----------
  function currentList() {
    if (filter === "learning") return order.filter(function (i) { return learningMarked.has(i); });
    return order.filter(function (i) { return filter === "all" || CARDS[i].cat === filter; });
  }

  function tabCount(key) {
    if (key === "all") return N;
    if (key === "learning") return learningMarked.size;
    return CARDS.filter(function (c) { return c.cat === key; }).length;
  }

  // A "pass" = the student has seen every card in the "All" list and then
  // moves forward past the last card (Next, or marking the last card). Each
  // pass writes one row to the Sheet, so repeated passes are all recorded.
  function notePassVisit(list) {
    if (filter !== "all" || list.length === 0) return;
    passVisited.add(list[pos]);
    savePassVisited();
  }

  function maybeSendLearnPass(list) {
    if (filter !== "all" || list.length === 0) return;
    if (pos !== list.length - 1) return;
    if (passVisited.size < N) return;
    passVisited = new Set();
    savePassVisited();
    const sparse = [];
    CARDS.forEach(function (_, i) {
      if (known.has(i)) sparse.push({ i: i, r: true });
      else if (learningMarked.has(i)) sparse.push({ i: i, r: false });
    });
    reportPass({ passMode: "learn", passCorrect: known.size, passSize: N, results: sparse, json: sparse });
  }

  function cardTag(item) { return item.cat ? item.cat : (DECK.cardTag || ""); }

  function renderLearn() {
    const list = currentList();
    learnTabs.forEach(function (t) { t.textContent = t.dataset.label + " (" + tabCount(t.dataset.filter) + ")"; });

    quizPanel.hidden = true;
    stage.hidden = false;
    cardEl.classList.remove("no-flip");
    cardEl.setAttribute("aria-label", "Flashcard, tap or press Enter to flip");
    // The hint shows on the first card after opening the deck, then goes.
    hintFront.hidden = !showHint;
    hintFront.textContent = TOUCH ? "Tap to flip · swipe for the next card" : "Tap card to reveal meaning";
    quizForm.hidden = true;
    feedbackBox.hidden = true;
    originBox.hidden = false;

    statusText.textContent = known.size + " of " + N + " known";
    progressFill.style.width = (known.size / N) * 100 + "%";

    if (list.length === 0) {
      // Nothing matches the current filter (e.g. "Still Learning" with
      // nothing marked yet) — show an empty state instead of faking a card,
      // and lock out every action that assumes a real card is on screen.
      termFront.textContent = "Nothing here yet";
      tagFront.textContent = "";
      hintFront.hidden = true;
      cardEl.classList.remove("flipped");
      tagBack.textContent = "";
      meaningBack.textContent = "";
      originBack.textContent = "";
      counterEl.textContent = "0 / 0";
      knownBtn.classList.remove("active");
      learningBtn.classList.remove("active");
      knownBtn.disabled = true;
      learningBtn.disabled = true;
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      return;
    }

    knownBtn.disabled = false;
    learningBtn.disabled = false;

    if (pos >= list.length) pos = 0;
    if (pos < 0) pos = list.length - 1;
    const idx = list[pos];
    const item = CARDS[idx];

    termFront.textContent = item.word;
    tagFront.textContent = cardTag(item);
    tagBack.textContent = cardTag(item);
    meaningBack.textContent = item.defn;
    originBack.textContent = item.origin;

    cardEl.classList.toggle("flipped", flipped);
    counterEl.textContent = (pos + 1) + " / " + list.length;

    const isKnown = known.has(idx);
    knownBtn.classList.toggle("active", isKnown);
    learningBtn.classList.toggle("active", !isKnown && learningMarked.has(idx));

    prevBtn.disabled = list.length <= 1;
    nextBtn.disabled = list.length <= 1;

    notePassVisit(list);
  }

  function flip() {
    if (mode !== "learn" || currentList().length === 0) return;
    flipped = !flipped;
    cardEl.classList.toggle("flipped", flipped);
  }

  // Cards move as a filmstrip (dir +1 = next, -1 = previous): the incoming
  // card travels in beside the current one with a fixed gap between them,
  // and both move together. A flick passes its speed in, so the strip
  // carries on at that speed and eases to a stop. One move asked for while
  // the strip is still moving waits its turn; any more are ignored.
  let sliding = false;
  let advancing = false;  // a Know it / Still learning tap is about to move on
  const slideQueue = [];
  const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const EASE_OUT = "cubic-bezier(0.22, 0.8, 0.32, 1)";
  const EASE_IN_OUT = "cubic-bezier(0.45, 0, 0.2, 1)";
  const GAP = 16;
  let dragPeek = null;  // { dir, el } while a finger drag shows the next card
  function cardX() { return new DOMMatrix(getComputedStyle(cardEl).transform).m41 || 0; }
  function stepWidth() { return cardEl.offsetWidth + GAP; }
  function place(el, x, ms, easing) {
    el.style.transition = ms ? "transform " + ms + "ms " + easing : "none";
    el.style.transform = x ? "translateX(" + x + "px)" : "";
  }
  function moveCard(x, ms, easing, done) {
    place(cardEl, x, ms, easing);
    if (done) setTimeout(done, ms);
  }

  // What the neighbouring card will show once the deck moves there.
  function neighbourInfo(dir) {
    if (mode === "learn") {
      const list = currentList();
      if (list.length <= 1) return null;
      const item = CARDS[list[(pos + dir + list.length) % list.length]];
      return { tag: cardTag(item), item: item, quiz: false };
    }
    if (dir > 0 && quiz && quiz.phase === "card" && quiz.answers[quiz.pos] && quiz.pos < quiz.order.length - 1) {
      return { tag: "Round " + quiz.round, item: CARDS[quiz.order[quiz.pos + 1]], quiz: true };
    }
    return null;
  }

  // A copy of the card showing the neighbour's front, as render() will draw it.
  function makePeek(info) {
    const el = cardEl.cloneNode(true);
    el.removeAttribute("id");
    el.removeAttribute("tabindex");
    el.setAttribute("aria-hidden", "true");
    el.querySelectorAll("[id]").forEach(function (n) { n.removeAttribute("id"); });
    el.classList.remove("flipped");
    el.classList.add("peek", "dragging");
    if (EXERCISE) {
      fillExerciseFront(el, info.item, null);
      stage.appendChild(el);
      return el;
    }
    el.querySelectorAll(".category-tag").forEach(function (n) { n.textContent = info.tag; });
    el.querySelector(".term").textContent = info.item.word;
    el.querySelector(".hint").hidden = true;
    el.querySelector(".meaning").textContent = info.item.defn;
    const origin = el.querySelector(".examples span:last-child");
    if (origin) origin.textContent = info.item.origin;
    el.querySelector(".feedback").hidden = true;
    el.querySelector(".quiz-form").hidden = !info.quiz;
    if (info.quiz) {
      const inp = el.querySelector("input");
      inp.value = "";
      inp.disabled = false;
      el.querySelectorAll(".quiz-form button").forEach(function (b) { b.disabled = false; });
      el.querySelector(".quiz-note").textContent = "";
    }
    stage.appendChild(el);
    return el;
  }
  function dropPeek() {
    if (dragPeek) { dragPeek.el.remove(); dragPeek = null; }
  }
  // During a finger drag: show the neighbour in the direction of the drag.
  function dragTo(dx) {
    const dir = dx < 0 ? 1 : -1;
    if (dragPeek && dragPeek.dir !== dir) dropPeek();
    if (!dragPeek) {
      const info = neighbourInfo(dir);
      dragPeek = { dir: dir, el: info ? makePeek(info) : null };
    }
    if (!dragPeek.el) { place(cardEl, dx * 0.3, 0); return; }  // nothing there: resist
    place(cardEl, dx, 0);
    place(dragPeek.el, dx + dir * stepWidth(), 0);
  }
  function snapBack() {
    const peek = dragPeek;
    dragPeek = null;
    moveCard(0, 340, EASE_OUT, function () { if (!sliding) cardEl.style.transition = ""; });
    if (peek && peek.el) {
      place(peek.el, peek.dir * stepWidth(), 340, EASE_OUT);
      setTimeout(function () { peek.el.remove(); }, 340);
    }
  }

  let slideToken = 0;
  // Switching mode or card set mid-slide drops the slide and anything queued.
  function cancelSlides() {
    slideToken++;
    slideQueue.length = 0;
    sliding = false;
    dropPeek();
    stage.querySelectorAll(".card.peek").forEach(function (n) { n.remove(); });
    cardEl.classList.remove("dragging");
    moveCard(0, 0);
    cardEl.style.transition = "";
  }

  function slideCard(dir, change, speed) {
    if (sliding) { if (slideQueue.length < 1) slideQueue.push([dir, change]); return; }
    const info = neighbourInfo(dir);
    if (REDUCED_MOTION || stage.hidden || !info) { dropPeek(); change(); return; }
    if (typeof speed !== "number") speed = 0;  // button clicks pass an event
    sliding = true;
    const tok = ++slideToken;
    const step = stepWidth();
    const x0 = cardX();
    let peek;
    if (dragPeek && dragPeek.dir === dir && dragPeek.el) { peek = dragPeek.el; dragPeek = null; }
    else { dropPeek(); peek = makePeek(info); place(peek, x0 + dir * step, 0); }
    void peek.offsetWidth;
    const remaining = Math.abs(dir * step + x0);
    let ms = speed ? 1.6 * remaining / Math.max(speed, 0.5) : 420;
    ms = Math.round(Math.max(200, Math.min(slideQueue.length ? 260 : 460, ms)));
    const easing = speed ? EASE_OUT : EASE_IN_OUT;
    cardEl.classList.add("dragging");
    place(cardEl, -dir * step, ms, easing);
    place(peek, 0, ms, easing);
    setTimeout(function () {
      if (tok !== slideToken) { peek.remove(); return; }
      // The real card takes over in the peek's place, already showing the
      // new content, so the swap is invisible.
      change();
      place(cardEl, 0, 0);
      peek.remove();
      void cardEl.offsetWidth;
      cardEl.classList.remove("dragging");
      cardEl.style.transition = "";
      sliding = false;
      const next = slideQueue.shift();
      if (next) slideCard(next[0], next[1]);
    }, ms);
  }

  function goNext(speed) {
    const list = currentList();
    if (mode !== "learn" || list.length === 0) return;
    slideCard(1, function () {
      maybeSendLearnPass(list);
      pos = (pos + 1) % list.length;
      flipped = false;
      showHint = false;
      render();
    }, speed);
  }

  function goPrev(speed) {
    const list = currentList();
    if (mode !== "learn" || list.length === 0) return;
    slideCard(-1, function () {
      pos = (pos - 1 + list.length) % list.length;
      flipped = false;
      showHint = false;
      render();
    }, speed);
  }

  function markKnown() {
    const list = currentList();
    if (list.length === 0 || sliding || advancing) return;
    advancing = true;
    const idx = list[pos];
    known.add(idx);
    learningMarked.delete(idx);
    saveKnown();
    saveLearning();
    render();
    setTimeout(function () { advancing = false; goNext(); }, 220);
  }

  function markLearning() {
    const list = currentList();
    if (list.length === 0 || sliding || advancing) return;
    advancing = true;
    const idx = list[pos];
    known.delete(idx);
    learningMarked.add(idx);
    saveKnown();
    saveLearning();
    render();
    setTimeout(function () { advancing = false; goNext(); }, 120);
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function shuffle() {
    const list = shuffleArray(currentList());
    // write back shuffled positions into `order` for this filter, preserving others
    if (filter === "all") {
      order = list;
    } else {
      const inFilter = filter === "learning"
        ? function (i) { return learningMarked.has(i); }
        : function (i) { return CARDS[i].cat === filter; };
      let cursor = 0;
      order = order.map(function (i) { return inFilter(i) ? list[cursor++] : i; });
    }
    pos = 0;
    flipped = false;
    render();
  }

  // ---------- Quiz mode ----------
  // Round 1 = every card, shuffled. Each later round = the cards missed in
  // the round before, until every card has been answered correctly.
  function newRound(round, indices) {
    const inBook = DECK.round1 === "book" && round === 1;
    return {
      round: round,
      set: filter,
      size: quiz && round > 1 ? quiz.size : indices.length,
      order: inBook ? indices.slice().sort(function (a, b) { return a - b; }) : shuffleArray(indices.slice()),
      pos: 0,
      answers: indices.map(function () { return null; }),
      phase: "card",
      sent: false
    };
  }

  function roundScore() {
    return quiz.answers.filter(function (a) { return a && a.ok; }).length;
  }

  function roundMissed() {
    return quiz.order.filter(function (_, k) { return !(quiz.answers[k] && quiz.answers[k].ok); });
  }

  function sendQuizRound() {
    if (quiz.sent) return;
    quiz.sent = true;
    const answers = quiz.order.map(function (i, k) {
      const a = quiz.answers[k] || {};
      const shown = a.a == null ? "" : (EXERCISE ? answerText(CARDS[i], a.a) : a.a);
      const row = { i: i, w: cardLabel(CARDS[i]), a: shown, r: !!a.ok };
      if (a.mixed) row.mixed = a.mixed;
      return row;
    });
    reportPass({
      passMode: "quiz round " + quiz.round + (QUIZ_BY_SET && quiz.set !== "all" ? " (" + setLabel(quiz.set) + ")" : ""),
      passCorrect: roundScore(),
      passSize: quiz.order.length,
      results: answers.map(function (x) { return { i: x.i, r: x.r }; }),
      answers: answers,
      json: answers
    });
  }

  let inputFor = null; // which quiz card the answer box currently belongs to

  // ---------- Exercise Decks: the question side of a card ----------
  function setLabel(key) {
    if (key === "all") return "All";
    if (key === "learning") return "Missed";
    return (CATS[key] && CATS[key].label) || key;
  }

  function setTitle(key) {
    if (key === "all") return "All exercises";
    if (key === "learning") return "Missed questions";
    return (CATS[key] && (CATS[key].title || CATS[key].label)) || key;
  }

  // The cards a quiz on this tab covers.
  function setIndices(key) {
    return CARDS.map(function (_, i) { return i; }).filter(function (i) {
      if (key === "all") return true;
      if (key === "learning") return learningMarked.has(i);
      return CARDS[i].cat === key;
    });
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // Fills a card's front (the real card or the copy that slides in) with
  // the question. ans = the checked answer, or null.
  function fillExerciseFront(root, item, ans) {
    const cat = CATS[item.cat] || {};
    const tag = (cat.label ? cat.label + " · " : "") + (quiz ? "Round " + quiz.round : "");
    root.querySelectorAll(".category-tag").forEach(function (n) { n.textContent = tag; });
    const instr = root.querySelector(".ex-instr");
    instr.innerHTML = "";
    if (cat.instruction) instr.appendChild(document.createTextNode(cat.instruction));
    if (cat.baseLine) instr.appendChild(el("span", "base-line", "Bases: " + cat.baseLine));
    if (cat.bank) instr.appendChild(el("span", "bank", "Word bank: " + cat.bank.join(", ") + "."));
    instr.hidden = !instr.childNodes.length;
    const term = root.querySelector(".term");
    term.textContent = item.word || "";
    term.hidden = !item.word;
    const prompt = root.querySelector(".prompt");
    prompt.innerHTML = "";
    (item.lines || []).forEach(function (ln) {
      const d = el("div", "line");
      d.appendChild(el("span", "line-label", ln[0]));
      d.appendChild(document.createTextNode(ln[1]));
      prompt.appendChild(d);
    });
    if (item.text) prompt.appendChild(el("div", "line", item.text));
    if (item.ask) prompt.appendChild(el("div", "ask", item.ask));
    prompt.hidden = !prompt.childNodes.length;
    root.querySelector(".hint").hidden = true;
    const list = root.querySelector(".choices");
    list.innerHTML = "";
    if (item.kind === "choice") {
      const opts = cardOptions(item);
      list.classList.toggle("long", opts.length > 6);
      opts.forEach(function (o, k) {
        const b = el("button", "choice");
        b.type = "button";
        b.dataset.k = k;
        const key = optionKey(item, k);
        if (key) b.appendChild(el("span", "opt-key", key));
        b.appendChild(el("span", "", o));
        b.disabled = !!ans;
        if (ans && ans.a === k) b.classList.add("picked");
        list.appendChild(b);
      });
    }
    list.hidden = item.kind !== "choice";
    list.scrollTop = 0;
    const form = root.querySelector(".quiz-form");
    form.hidden = item.kind === "choice";
    const inp = form.querySelector("input");
    inp.placeholder = item.placeholder || "Type your answer";
    if (root !== cardEl) {
      inp.value = "";
      inp.disabled = false;
      form.querySelectorAll("button").forEach(function (b) { b.disabled = false; });
      form.querySelector(".quiz-note").textContent = "";
    }
  }

  // The answer side: the right answer, a note (a base's meanings, one per
  // line), and the student's answer with the verdict.
  function fillExerciseBack(item, ans) {
    meaningBack.innerHTML = "";
    if (item.word) meaningBack.appendChild(el("div", "back-word", item.word));
    else if (item.kind === "choice" && item.text) meaningBack.appendChild(el("div", "back-text", item.text));
    if (item.kind === "choice") {
      const key = optionKey(item, item.answer);
      if (key) meaningBack.appendChild(el("span", "answer-key", key));
      meaningBack.appendChild(document.createTextNode(cardOptions(item)[item.answer]));
    } else {
      meaningBack.textContent = item.answerText || (item.accept || [])[0] || "";
    }
    originBack.innerHTML = "";
    if (item.glossMeanings) {
      originLabel.textContent = item.glossMeanings.length > 1 ? "Meanings" : "Meaning";
      item.glossMeanings.forEach(function (m) { originBack.appendChild(el("div", "", m)); });
    } else {
      originLabel.textContent = "";
      if (item.answerNote) originBack.textContent = item.answerNote;
    }
    originLabel.hidden = !originLabel.textContent;
    originBox.hidden = !originBack.childNodes.length;
    feedbackBox.hidden = !ans;
    if (ans) {
      yourAnswer.textContent = answerText(item, ans.a);
      verdictEl.textContent = ans.ok ? "Correct" : "Not quite";
      verdictEl.className = "verdict " + (ans.ok ? "ok" : "no");
      verdictReason.hidden = true;
    }
  }

  // Phones open the keyboard only for a question that is typed.
  function needsTyping() {
    if (!quiz || quiz.phase !== "card") return false;
    return !EXERCISE || CARDS[quiz.order[quiz.pos]].kind !== "choice";
  }

  function renderQuiz() {
    learnTabs.forEach(function (t) { t.textContent = t.dataset.label + " (" + tabCount(t.dataset.filter) + ")"; });

    if (!quiz || quiz.phase !== "card") {
      renderQuizPanel();
      return;
    }

    quizPanel.hidden = true;
    stage.hidden = false;
    quizControls.hidden = false;

    const idx = quiz.order[quiz.pos];
    const item = CARDS[idx];
    const ans = quiz.answers[quiz.pos];
    const key = quiz.round + ":" + quiz.pos;
    if (inputFor !== key) {
      inputFor = key;
      answerInput.value = ans ? ans.a : "";
      quizNote.textContent = "";
    }

    cardEl.classList.add("no-flip");
    cardEl.setAttribute("aria-label", "Quiz card");
    if (EXERCISE) {
      fillExerciseFront(cardEl, item, ans);
      answerInput.disabled = !!ans;
      checkBtn.disabled = !!ans;
      fillExerciseBack(item, ans);
      cardEl.classList.toggle("flipped", !!ans);
      const done = quiz.answers.filter(Boolean).length;
      statusText.textContent = "Round " + quiz.round + " · " + done + " of " + quiz.order.length + " answered";
      progressFill.style.width = (done / quiz.order.length) * 100 + "%";
      quizCounter.textContent = (quiz.pos + 1) + " / " + quiz.order.length;
      quizNextBtn.disabled = !ans;
      quizNextBtn.innerHTML = quiz.pos === quiz.order.length - 1 ? "Finish round &rarr;" : "Next &rarr;";
      return;
    }
    tagFront.textContent = "Round " + quiz.round;
    tagBack.textContent = "Round " + quiz.round;
    termFront.textContent = item.word;
    hintFront.hidden = true;
    quizForm.hidden = false;
    answerInput.disabled = !!ans;
    checkBtn.disabled = !!ans;

    meaningBack.textContent = item.defn;
    originBox.hidden = false;
    originBack.textContent = item.origin;
    feedbackBox.hidden = !ans;
    if (ans) {
      yourAnswer.textContent = ans.a;
      verdictEl.textContent = ans.ok ? "Correct" : "Not quite";
      verdictEl.className = "verdict " + (ans.ok ? "ok" : "no");
      verdictReason.hidden = !ans.mixed;
      verdictReason.textContent = ans.mixed ? "That answer mixes in the meaning of “" + ans.mixed + "”." : "";
    }
    cardEl.classList.toggle("flipped", !!ans);

    const answered = quiz.answers.filter(Boolean).length;
    statusText.textContent = "Round " + quiz.round + " · " + answered + " of " + quiz.order.length + " answered";
    progressFill.style.width = (answered / quiz.order.length) * 100 + "%";
    quizCounter.textContent = (quiz.pos + 1) + " / " + quiz.order.length;
    quizNextBtn.disabled = !ans;
    quizNextBtn.innerHTML = quiz.pos === quiz.order.length - 1 ? "Finish round &rarr;" : "Next &rarr;";
  }

  function panelButton(cls, label, onClick) {
    const b = document.createElement("button");
    b.className = cls;
    b.innerHTML = label;
    b.addEventListener("click", onClick);
    return b;
  }

  function renderQuizPanel() {
    stage.hidden = true;
    quizControls.hidden = true;
    quizPanel.hidden = false;
    quizPanel.innerHTML = "";
    const title = document.createElement("div");
    title.className = "panel-title";
    const copy = document.createElement("div");
    copy.className = "panel-copy";
    const actions = document.createElement("div");
    actions.className = "panel-actions";

    if (!quiz && EXERCISE) {
      const size = setIndices(filter).length;
      const cat = CATS[filter] || {};
      statusText.textContent = known.size + " of " + N + " correct";
      progressFill.style.width = "0%";
      title.textContent = setTitle(filter);
      quizPanel.appendChild(title);
      if (!size) {
        copy.textContent = "Nothing here yet. Questions you miss will be listed here.";
        quizPanel.appendChild(copy);
        return;
      }
      copy.textContent = (cat.instruction ? cat.instruction + " " : "") +
        "Round 1 covers all " + size + " question" + (size === 1 ? "" : "s") + (DECK.round1 === "book" ? ", in the workbook\u2019s order" : "") +
        ". Any you miss come back in the next round, until you have answered every one correctly.";
      quizPanel.appendChild(copy);
      actions.appendChild(panelButton("nav-btn", "Start the quiz &rarr;", startQuiz));
      quizPanel.appendChild(actions);
      return;
    }

    if (!quiz) {
      statusText.textContent = known.size + " of " + N + " known";
      progressFill.style.width = "0%";
      title.textContent = "Quiz";
      copy.textContent = "Type the meaning of each word, then press Check. Round 1 covers all " + N +
        " words. Any you miss come back in the next round, until you have answered every word correctly.";
      quizPanel.appendChild(title);
      quizPanel.appendChild(copy);
      actions.appendChild(panelButton("nav-btn", "Start the quiz &rarr;", startQuiz));
      quizPanel.appendChild(actions);
      return;
    }

    const score = roundScore();
    const size = quiz.order.length;
    progressFill.style.width = "100%";
    const scoreEl = document.createElement("div");
    scoreEl.className = "panel-score";
    scoreEl.textContent = score + " / " + size;

    if (quiz.phase === "between") {
      const missed = size - score;
      statusText.textContent = "Round " + quiz.round + " complete";
      title.textContent = "Round " + quiz.round + " complete";
      const noun = EXERCISE ? "question" : "word";
      copy.textContent = "Next is Round " + (quiz.round + 1) + ": the " + missed + " " + noun + (missed === 1 ? "" : "s") +
        " you missed, in a new order.";
      quizPanel.appendChild(title);
      quizPanel.appendChild(scoreEl);
      quizPanel.appendChild(copy);
      actions.appendChild(panelButton("nav-btn", "Start Round " + (quiz.round + 1) + " &rarr;", startNextRound));
    } else {
      statusText.textContent = "Quiz complete";
      title.textContent = "Quiz complete";
      const total = EXERCISE ? quiz.size : N;
      copy.textContent = "You have answered all " + total + " " + (EXERCISE ? "question" : "word") + (total === 1 ? "" : "s") + " correctly" +
        (quiz.round > 1 ? ", in " + quiz.round + " rounds." : " in a single round.");
      quizPanel.appendChild(title);
      quizPanel.appendChild(copy);
      actions.appendChild(panelButton("nav-btn", "Take the quiz again", startQuiz));
      if (!EXERCISE) actions.appendChild(panelButton("secondary-btn", "Back to Learn", function () { quiz = null; saveQuiz(); setMode("learn"); }));
    }
    quizPanel.appendChild(actions);
    const firstBtn = actions.querySelector("button");
    if (firstBtn) firstBtn.focus();
  }

  function startQuiz() {
    const indices = QUIZ_BY_SET ? setIndices(filter) : CARDS.map(function (_, i) { return i; });
    if (!indices.length) return;
    quiz = null;
    quiz = newRound(1, indices);
    inputFor = null;
    saveQuiz();
    render();
    if (needsTyping()) answerInput.focus();
  }

  function startNextRound() {
    quiz = newRound(quiz.round + 1, roundMissed());
    inputFor = null;
    saveQuiz();
    render();
    if (needsTyping()) answerInput.focus();
  }

  // choice = the option tapped, on an Exercise Deck's choice question.
  function checkAnswer(choice) {
    if (!quiz || quiz.phase !== "card" || quiz.answers[quiz.pos] || sliding) return;
    const idx = quiz.order[quiz.pos];
    const isChoice = EXERCISE && CARDS[idx].kind === "choice";
    if (isChoice && typeof choice !== "number") return;
    const text = isChoice ? choice : answerInput.value.trim();
    const result = EXERCISE ? judgeExercise(idx, text) : judge(idx, text);
    if (result.empty) { quizNote.textContent = "Type your answer first."; answerInput.focus(); return; }
    if (result.tooLong) { quizNote.textContent = "Please keep your answer to " + MAX_ANSWER_WORDS + " words or fewer."; answerInput.focus(); return; }
    quizNote.textContent = "";
    quiz.answers[quiz.pos] = { a: text, ok: result.ok, mixed: result.mixed || null };
    if (result.ok) { known.add(idx); learningMarked.delete(idx); }
    else { known.delete(idx); learningMarked.add(idx); }
    saveKnown();
    saveLearning();
    if (quiz.answers.every(Boolean)) sendQuizRound();
    saveQuiz();
    render();
    quizNextBtn.focus();
  }

  function quizNext(speed) {
    if (!quiz || quiz.phase !== "card" || !quiz.answers[quiz.pos] || sliding) return;
    if (quiz.pos < quiz.order.length - 1) {
      slideCard(1, function () {
        quiz.pos++;
        saveQuiz();
        render();
      }, speed);
      // Focus now, inside the tap, so phones open the keyboard (the old
      // card's front is hidden, so clearing the box early is not seen).
      answerInput.disabled = false;
      answerInput.value = "";
      if (!EXERCISE || CARDS[quiz.order[quiz.pos + 1]].kind !== "choice") answerInput.focus();
      return;
    }
    if (!quiz.sent) sendQuizRound();
    quiz.phase = roundMissed().length ? "between" : "done";
    saveQuiz();
    render();
  }

  // ---------- Rendering & mode switching ----------
  function render() {
    modeTabs.forEach(function (t) {
      const on = t.dataset.mode === mode;
      t.classList.toggle("active", on);
      t.setAttribute("aria-selected", on ? "true" : "false");
    });
    learnTabsEl.hidden = mode !== "learn" && !QUIZ_BY_SET;
    learnTools.hidden = mode !== "learn";
    learnControls.hidden = mode !== "learn";
    if (mode === "learn") {
      quizControls.hidden = true;
      footerHelp.textContent = "Click the card (or press Space) to flip · Arrow keys or a two-finger swipe to move";
      renderLearn();
    } else {
      footerHelp.textContent = EXERCISE ? "Tap an answer, or type it and press Enter to check" : "Type the meaning and press Enter to check";
      renderQuiz();
    }
    if (typeof fitPhone === "function") fitPhone();
  }

  function setMode(m) {
    cancelSlides();
    mode = m;
    flipped = false;
    inputFor = null;
    render();
    if (mode === "quiz" && quiz && quiz.phase === "card" && !quiz.answers[quiz.pos] && needsTyping()) answerInput.focus();
  }

  cardEl.addEventListener("click", function (e) {
    if (mode !== "learn") return;
    if (Date.now() - swipeHandledAt < 500) return;
    flip();
  });
  cardEl.addEventListener("keydown", function (e) {
    if (mode !== "learn") return;
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); flip(); }
  });

  document.addEventListener("keydown", function (e) {
    if (deckScreen.hidden || mode !== "learn") return;
    if (e.target === cardEl) return;
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "BUTTON")) return;
    if (e.code === "ArrowRight") goNext();
    if (e.code === "ArrowLeft") goPrev();
    if (e.code === "Space") { e.preventDefault(); flip(); }
  });

  prevBtn.addEventListener("click", goPrev);
  nextBtn.addEventListener("click", goNext);
  knownBtn.addEventListener("click", function (e) { e.stopPropagation(); markKnown(); });
  learningBtn.addEventListener("click", function (e) { e.stopPropagation(); markLearning(); });
  shuffleBtn.addEventListener("click", shuffle);
  checkBtn.addEventListener("click", function (e) { e.stopPropagation(); checkAnswer(); });
  choiceList.addEventListener("click", function (e) {
    e.stopPropagation();
    const b = e.target.closest && e.target.closest(".choice");
    if (b && !b.disabled) checkAnswer(Number(b.dataset.k));
  });
  answerInput.addEventListener("click", function (e) { e.stopPropagation(); });
  answerInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); checkAnswer(); }
  });
  answerInput.addEventListener("input", function () { quizNote.textContent = ""; });
  quizNextBtn.addEventListener("click", quizNext);

  // ---------- Touch, swipe and trackpad ----------
  // Touchscreens (phones and tablets) swipe between cards; phones also get
  // the compact layout with the buttons pinned to the bottom of the screen.
  function applyDeviceClasses() {
    document.documentElement.classList.toggle("touch", TOUCH);
    document.documentElement.classList.toggle("phone", TOUCH && Math.min(window.innerWidth, screen.width) <= 600);
    fitPhone();
  }
  window.addEventListener("resize", applyDeviceClasses);

  // Phones: size the card so the whole screen fits without scrolling (the
  // page then has nothing to scroll, so it cannot be left scrolled).
  function fitPhone() {
    const root = document.documentElement;
    if (!root.classList.contains("phone") || deckScreen.hidden || root.classList.contains("typing")) return;
    const box = !stage.hidden ? cardEl.querySelector(".face-front") : (!quizPanel.hidden ? quizPanel : null);
    if (!box) return;
    const cur = parseFloat(getComputedStyle(box).minHeight) || 0;
    const bottom = deckScreen.getBoundingClientRect().bottom + window.scrollY + (parseFloat(getComputedStyle(document.body).paddingBottom) || 0);
    const h = Math.max(200, Math.min(460, Math.floor(cur + window.innerHeight - bottom - 2)));
    root.style.setProperty("--fit-h", h + "px");
    // A long list of options gets shorter until the card fits above the
    // pinned Next bar; the list scrolls inside the card.
    if (EXERCISE && !stage.hidden && !choiceList.hidden && choiceList.classList.contains("long")) {
      choiceList.style.maxHeight = "";
      const limit = quizControls.hidden ? window.innerHeight : quizControls.getBoundingClientRect().top;
      const over = cardEl.getBoundingClientRect().bottom - (limit - 8);
      if (over > 0) choiceList.style.maxHeight = Math.max(120, choiceList.clientHeight - over) + "px";
    }
    // Keep the selected exercise tab in view in its sideways-scrolling row.
    if (EXERCISE) {
      const on = learnTabsEl.querySelector(".tab.active");
      if (on) learnTabsEl.scrollLeft = Math.max(0, on.offsetLeft - learnTabsEl.offsetLeft - (learnTabsEl.clientWidth - on.offsetWidth) / 2);
    }
  }
  applyDeviceClasses();

  // dir +1 = next card, -1 = previous card. In a quiz you can only move on,
  // and only once the answer has been checked.
  function swipe(dir, speed) {
    if (deckScreen.hidden) return false;
    if (mode === "learn") {
      if (currentList().length <= 1) return false;
      if (dir > 0) goNext(speed); else goPrev(speed);
      return true;
    }
    // In a quiz each card must be checked first, so swipes are not queued.
    if (dir > 0 && !sliding && quiz && quiz.phase === "card" && quiz.answers[quiz.pos]) { quizNext(speed); return true; }
    return false;
  }

  let touchStart = null;
  let swipeHandledAt = 0;
  stage.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1 || (e.target.closest && e.target.closest("input, button, textarea"))) { touchStart = null; return; }
    const x = e.touches[0].clientX;
    // During a slide the gesture still counts (it is queued) but does not drag.
    touchStart = { x: x, y: e.touches[0].clientY, dragging: false, follow: !sliding, track: [[e.timeStamp, x]] };
  }, { passive: true });
  stage.addEventListener("touchmove", function (e) {
    if (!touchStart) return;
    const x = e.touches[0].clientX;
